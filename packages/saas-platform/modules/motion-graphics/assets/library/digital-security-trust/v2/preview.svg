<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc" aria-label="امنیت و اعتماد دیجیتال"><title id="title">پیش‌نمایش امنیت و اعتماد دیجیتال</title><desc id="desc">نمایش عبور داده رمزگذاری‌شده از لایه محافظ، قفل مرکزی و تراکنش تأییدشده.</desc>
<style id="asset-theme">:root{--asset-primary:#42c7b5;--asset-secondary:#1b3554;--asset-accent:#e4b94f;--asset-background:#f3f7f7;--asset-border:#17304d;color:var(--asset-border);--asset-current:currentColor}</style><style>:root{--primary:var(--asset-primary);--accent:var(--asset-primary);--ink:var(--asset-background);--muted:var(--asset-primary);--surface:var(--asset-border);--soft:var(--asset-border);--speed:9s}.panel{fill:var(--surface);stroke:var(--accent);stroke-width:1.5}.soft{fill:var(--soft);stroke:var(--accent);stroke-width:1.3}.primary{fill:none;stroke:var(--primary);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.accent{fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round}.muted-line{fill:none;stroke:var(--muted);stroke-width:1.4;stroke-linecap:round}.label{fill:var(--muted);font:12px Tahoma,Arial,sans-serif;text-anchor:middle}.small{fill:var(--ink);font:12px Tahoma,Arial,sans-serif}.tiny{fill:var(--muted);font:10px Tahoma,Arial,sans-serif}.copy{animation:copy var(--speed) ease-in-out infinite}@keyframes copy{0%,8%,96%,100%{opacity:.65;transform:translateX(5px)}20%,86%{opacity:1;transform:none}}.data{animation:dataFlow 3s ease-in-out infinite}.d2{animation-delay:-1s}.d3{animation-delay:-2s}.ingress,.egress{fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:5 8;animation:dash 2s linear infinite}.outer-shield{fill:var(--surface);stroke:var(--primary);stroke-width:2.5}.inner-shield{fill:var(--soft);stroke:var(--accent);stroke-width:2;animation:shieldPulse 3s ease-in-out infinite}.lock-body{fill:var(--surface);stroke:var(--primary);stroke-width:2}.lock-loop{fill:none;stroke:var(--primary);stroke-width:3}.verification{fill:var(--accent);stroke:var(--surface);stroke-width:2;animation:verified 3s ease-in-out infinite}.verification path{fill:none;stroke:var(--surface);stroke-width:3}.transaction{animation:transaction var(--speed) ease-in-out infinite}@keyframes dataFlow{0%,100%{transform:translateX(0);opacity:.7}50%{transform:translateX(8px);opacity:1}}@keyframes dash{to{stroke-dashoffset:-26}}@keyframes shieldPulse{50%{opacity:.65;transform:scale(.96)}}@keyframes verified{50%{transform:scale(1.12)}}@keyframes transaction{0%,100%{transform:translateY(3px)}50%{transform:translateY(-4px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}.smil{display:none}}*{animation:none!important}.smil{display:none}</style><rect width="960" height="540" rx="28" fill="var(--asset-border)"/><g class="security-scene">
<g class="encrypted-stream" transform="translate(70 185)"><g class="data d1"><rect class="soft" width="95" height="36" rx="9"/><path class="accent" d="M14 18h42M65 18h16"/></g><g class="data d2" transform="translate(0 58)"><rect class="soft" width="115" height="36" rx="9"/><path class="accent" d="M14 18h26M49 18h52"/></g><g class="data d3" transform="translate(0 116)"><rect class="soft" width="82" height="36" rx="9"/><path class="accent" d="M14 18h22M45 18h23"/></g><text class="label" x="55" y="184">داده رمزگذاری‌شده</text></g>
<path class="ingress" d="M195 263H270"/>
<g class="shield-stack" transform="translate(365 270)"><path class="outer-shield" d="M0-112c42 27 78 31 104 34v59c0 65-33 104-104 134-71-30-104-69-104-134v-59c26-3 62-7 104-34z"/><path class="inner-shield" d="M0-82c31 20 57 23 76 25v43c0 47-24 76-76 98-52-22-76-51-76-98v-43c19-2 45-5 76-25z"/><g class="vault-lock"><rect class="lock-body" x="-34" y="-8" width="68" height="55" rx="12"/><path class="lock-loop" d="M-21-8v-22a21 21 0 0 1 42 0v22M0 12v18"/><circle cx="0" cy="11" r="6" fill="var(--primary)"/></g><g class="verification"><circle cx="68" cy="-65" r="24"/><path d="m56-65 9 9 17-21"/></g></g>
<path class="egress" d="M470 263H520"/>
<g class="transaction" transform="translate(535 205)"><rect class="panel card" width="115" height="125" rx="18"/><path class="muted-line" d="M18 35h79M18 55h40"/><rect class="soft" x="18" y="75" width="79" height="30" rx="8"/><path class="accent" d="m33 90 8 8 16-20"/><text class="label" x="57" y="150">تراکنش امن</text></g>
<g class="smil"><rect width="24" height="12" rx="3" fill="var(--primary)"><animateTransform attributeName="transform" type="translate" values="190 257;270 257" dur="2.2s" repeatCount="indefinite"/></rect></g></g><g class="copy" direction="rtl" text-anchor="end" font-family="Tahoma,Arial,sans-serif"><rect x="680" y="168" width="4" height="102" rx="2" fill="var(--primary)"/><text x="900" y="208" fill="var(--ink)" font-size="28" font-weight="700">امنیت و اعتماد دیجیتال</text><text x="900" y="247" fill="var(--muted)" font-size="15">حفاظت چندلایه از هویت و تراکنش</text><path d="M900 298H752" fill="none" stroke="var(--accent)" stroke-width="1.5"/><text x="900" y="334" fill="var(--muted)" font-size="12">encrypted data blocks  •  layered shield  •  central lock</text></g></svg>
