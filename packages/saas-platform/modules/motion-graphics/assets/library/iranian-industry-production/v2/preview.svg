<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc" aria-label="صنعت و تولید ایران"><title id="title">پیش‌نمایش صنعت و تولید ایران</title><desc id="desc">نمایش توان تولیدی ایران با کارخانه، ماشین‌آلات، خط مونتاژ، مهندسی و کنترل کیفیت.</desc>
<style id="asset-theme">:root{--asset-primary:#42c7b5;--asset-secondary:#1b3554;--asset-accent:#e4b94f;--asset-background:#f3f7f7;--asset-border:#17304d;color:var(--asset-border);--asset-current:currentColor}</style><style>:root{--primary:var(--asset-accent);--accent:var(--asset-primary);--ink:var(--asset-background);--muted:var(--asset-primary);--surface:var(--asset-border);--soft:var(--asset-border);--speed:9s}.panel{fill:var(--surface);stroke:var(--accent);stroke-width:1.5}.soft{fill:var(--soft);stroke:var(--accent);stroke-width:1.4}.primary{fill:none;stroke:var(--primary);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.accent{fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.muted-line{fill:none;stroke:var(--muted);stroke-width:1.4;stroke-linecap:round}.label{fill:var(--muted);font:12px Tahoma,Arial,sans-serif;text-anchor:middle}.small{fill:var(--ink);font:12px Tahoma,Arial,sans-serif}.tiny{fill:var(--muted);font:10px Tahoma,Arial,sans-serif}.copy{animation:copy var(--speed) ease-in-out infinite}@keyframes copy{0%,8%,96%,100%{opacity:.65;transform:translateX(5px)}20%,86%{opacity:1;transform:none}}.factory-body,.primary{fill:none;stroke:var(--primary);stroke-width:2;stroke-linejoin:round}.smoke{fill:none;stroke:var(--muted);stroke-width:2;animation:smoke 3s ease-in-out infinite}.gear-wheel{fill:var(--surface);stroke:var(--accent);stroke-width:2}.gear-lines{fill:none;stroke:var(--accent);stroke-width:3}.machine{animation:rotate 7s linear infinite;transform-box:fill-box;transform-origin:center}.machine .label{animation:counter 7s linear infinite;transform-box:fill-box;transform-origin:center}.press{animation:press 2.6s ease-in-out infinite}.press-head{fill:var(--primary)}.package{fill:var(--soft);stroke:var(--primary)}.packages{animation:conveyor 5s linear infinite}.scanner{stroke:var(--accent);stroke-width:3;animation:scan 2s ease-in-out infinite}.quality .accent{fill:none;stroke:var(--accent);stroke-width:3}.quality{animation:quality var(--speed) ease-in-out infinite}@keyframes smoke{50%{transform:translateY(-12px);opacity:.2}}@keyframes rotate{to{transform:rotate(360deg)}}@keyframes counter{to{transform:rotate(-360deg)}}@keyframes press{50%{transform:translateY(14px)}}@keyframes conveyor{to{transform:translateX(90px)}}@keyframes scan{50%{transform:translateY(55px)}}@keyframes quality{0%,100%{opacity:.75}50%{opacity:1}}@media(prefers-reduced-motion:reduce){*{animation:none!important}.smil{display:none}}*{animation:none!important}.smil{display:none}</style><rect width="960" height="540" rx="28" fill="var(--asset-border)"/><g class="factory-story">
<g class="factory" transform="translate(80 150)"><path class="factory-body" d="M0 205V70h52v45l60-38v38l62-38v38l65-38v128M-12 205h270M24 175h40v30m28-30h40v30m30-30h40v30M176 77V15h38v85"/><path class="smoke" d="M194 1c-18-14 9-24-5-40"/></g>
<g class="machine" transform="translate(300 230)"><circle class="gear-wheel" r="47"/><path class="gear-lines" d="M0-47v16M0 31v16M-47 0h16M31 0h16M-33-33l12 12M21 21l12 12M33-33 21-21M-21 21-33 33"/><circle class="soft" r="17"/><text class="label" y="74">ماشین‌آلات</text></g>
<g class="press" transform="translate(430 185)"><path class="primary" d="M-43-55h86v22H-43zM-25-33v45h50v-45M-35 12h70v20h-70M0 32v38"/><rect class="press-head" x="-24" y="65" width="48" height="14" rx="4"/></g>
<g class="conveyor" transform="translate(260 365)"><path class="muted-line" d="M-160 0h360M-145 24h330M-120 0v24m48-24v24m48-24v24m48-24v24m48-24v24m48-24v24m48-24v24"/><g class="packages"><rect class="package p1" x="-125" y="-39" width="48" height="38" rx="5"/><rect class="package p2" x="-35" y="-39" width="48" height="38" rx="5"/><rect class="package p3" x="55" y="-39" width="48" height="38" rx="5"/></g></g>
<g class="quality" transform="translate(555 320)"><rect class="panel" x="-55" y="-75" width="110" height="150" rx="18"/><path class="scanner" d="M-35-34h70"/><path class="accent" d="M-22 10-6 26 25-12"/><text class="label" y="56">کنترل کیفیت</text></g>
<g class="smil"><rect x="320" y="326" width="48" height="38" rx="5" fill="var(--primary)" opacity=".75"><animateTransform attributeName="transform" type="translate" values="-180 0;210 0" dur="5s" repeatCount="indefinite"/></rect></g></g><g class="copy" direction="rtl" text-anchor="end" font-family="Tahoma,Arial,sans-serif"><rect x="680" y="168" width="4" height="102" rx="2" fill="var(--primary)"/><text x="900" y="208" fill="var(--ink)" font-size="28" font-weight="700">صنعت و تولید ایران</text><text x="900" y="247" fill="var(--muted)" font-size="15">مهندسی، تولید و کنترل کیفیت</text><path d="M900 298H752" fill="none" stroke="var(--accent)" stroke-width="1.5"/><circle cx="752" cy="298" r="3" fill="var(--accent)"/><text x="900" y="334" fill="var(--muted)" font-size="12">factory hall  •  conveyor belt  •  rotating gear</text></g></svg>
