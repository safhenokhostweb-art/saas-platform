<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc" aria-label="تحول دیجیتال کسب‌وکار ایرانی"><title id="title">تحول دیجیتال کسب‌وکار ایرانی</title><desc id="desc">روایت تبدیل فرایند سنتی شرکت ایرانی به عملیات ابری، خودکار و داده‌محور.</desc>
<style id="asset-theme">:root{--asset-primary:#42c7b5;--asset-secondary:#1b3554;--asset-accent:#e4b94f;--asset-background:#f3f7f7;--asset-border:#17304d;color:var(--asset-border);--asset-current:currentColor}</style><style>:root{--primary:var(--asset-accent);--accent:var(--asset-primary);--ink:var(--asset-background);--muted:var(--asset-primary);--surface:var(--asset-border);--soft:var(--asset-border);--speed:9s}.panel{fill:var(--surface);stroke:var(--accent);stroke-width:1.5}.soft{fill:var(--soft);stroke:var(--accent);stroke-width:1.4}.primary{fill:none;stroke:var(--primary);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.accent{fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.muted-line{fill:none;stroke:var(--muted);stroke-width:1.4;stroke-linecap:round}.label{fill:var(--muted);font:12px Tahoma,Arial,sans-serif;text-anchor:middle}.small{fill:var(--ink);font:12px Tahoma,Arial,sans-serif}.tiny{fill:var(--muted);font:10px Tahoma,Arial,sans-serif}.copy{animation:copy var(--speed) ease-in-out infinite}@keyframes copy{0%,8%,96%,100%{opacity:.65;transform:translateX(5px)}20%,86%{opacity:1;transform:none}}.old-office{animation:oldFade var(--speed) ease-in-out infinite}.paper{animation:paper 3s ease-in-out infinite}.layer{fill:var(--surface);stroke:var(--accent);stroke-opacity:.35}.l1{animation:layer1 var(--speed) ease-in-out infinite}.l2{animation:layer2 var(--speed) ease-in-out infinite}.l3{animation:layer3 var(--speed) ease-in-out infinite}.flow{fill:none;stroke:var(--primary);stroke-width:2;stroke-dasharray:5 8;animation:dash 2s linear infinite}.cloud{fill:var(--surface);stroke:var(--accent);stroke-width:2}.dashboard{animation:dashboard var(--speed) ease-in-out infinite}.chart{stroke-dasharray:140;animation:draw var(--speed) ease-in-out infinite}.gear{animation:gear 5s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes oldFade{0%,100%{opacity:.7}30%,78%{opacity:1}}@keyframes paper{50%{transform:translateY(-5px)}}@keyframes layer1{50%{transform:translate(-8px,8px)}}@keyframes layer2{50%{transform:translate(0,0)}}@keyframes layer3{50%{transform:translate(8px,-8px)}}@keyframes dash{to{stroke-dashoffset:-26}}@keyframes dashboard{0%,15%,100%{opacity:.5;transform:translateY(8px)}30%,86%{opacity:1;transform:none}}@keyframes draw{0%,20%,100%{stroke-dashoffset:140}45%,85%{stroke-dashoffset:0}}@keyframes gear{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}.smil{display:none}}</style><g class="transform-story">
<g class="old-office" transform="translate(105 275)"><rect class="panel" x="-60" y="-72" width="120" height="144" rx="18"/><path class="primary" d="M-37 46v-76L0-51l37 21v76M-48 46h96M-19 46V14h38v32"/><g class="paper"><rect class="soft" x="-25" y="-13" width="50" height="33" rx="4"/><path class="muted-line" d="M-16-4h32M-16 5H8"/></g><text class="label" y="94">فرایند سنتی</text></g>
<g class="layers" transform="translate(265 275)"><rect class="layer l1" x="-48" y="-52" width="96" height="104" rx="16"/><rect class="layer l2" x="-38" y="-42" width="96" height="104" rx="16"/><rect class="layer l3" x="-28" y="-32" width="96" height="104" rx="16"/><path class="accent" d="M-8-9h34M-8 3h22M-8 15h42"/><text class="label" x="10" y="91">تبدیل داده</text></g>
<path id="transform-flow" class="flow" d="M165 275H205M333 275H395"/>
<g class="digital-platform" transform="translate(490 268)"><path class="cloud" d="M-64-24c5-22 21-34 43-30 11-20 45-17 51 8 24-3 39 12 36 32H-64c-20 0-22-30 0-32z"/><rect class="panel dashboard" x="-72" y="4" width="144" height="105" rx="18"/><path class="accent chart" d="M-48 79-24 56-4 65l27-36 25 14"/><path class="muted-line" d="M-48 90h96"/><g class="gear"><circle class="soft" cx="-42" cy="29" r="12"/><path class="accent" d="M-42 20v18m-9-9h18"/></g><text class="label" y="132">عملیات دیجیتال</text></g>
<g class="smil"><circle r="4" fill="var(--primary)"><animateMotion dur="2.8s" repeatCount="indefinite" path="M165 275H205"/></circle><circle r="4" fill="var(--accent)"><animateMotion dur="2.4s" begin="-1s" repeatCount="indefinite" path="M333 275H395"/></circle></g></g><g class="copy" direction="rtl" text-anchor="end" font-family="Tahoma,Arial,sans-serif"><rect x="680" y="168" width="4" height="102" rx="2" fill="var(--primary)"/><text x="900" y="208" fill="var(--ink)" font-size="28" font-weight="700">تحول دیجیتال کسب‌وکار ایرانی</text><text x="900" y="247" fill="var(--muted)" font-size="15">از فرایند سنتی تا سازمان داده‌محور</text><path d="M900 298H752" fill="none" stroke="var(--accent)" stroke-width="1.5"/><circle cx="752" cy="298" r="3" fill="var(--accent)"/><text x="900" y="334" fill="var(--muted)" font-size="12">traditional office  •  transformation layers  •  cloud platform</text></g></svg>
