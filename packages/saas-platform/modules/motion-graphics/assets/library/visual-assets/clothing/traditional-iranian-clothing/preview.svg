<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="preview-title-traditional-iranian-clothing preview-desc-traditional-iranian-clothing" aria-label="لباس سنتی ایرانی">
