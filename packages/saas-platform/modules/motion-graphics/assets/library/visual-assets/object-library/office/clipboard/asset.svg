<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title-clipboard desc-clipboard" aria-label="Clipboard">
<title id="title-clipboard">Clipboard</title>
<desc id="desc-clipboard">دارایی برداری Clipboard از مجموعه اداری با پشتیبانی کامل از رنگ‌بندی پوسته.</desc>
<style>:root{--asset-primary:var(--theme-primary,#42c7b5);--asset-secondary:var(--theme-secondary,#1b3554);--asset-accent:var(--theme-accent,#e4b94f);--asset-background:var(--theme-background,#f3f7f7);--asset-border:var(--theme-border,#17304d);--asset-shadow:var(--theme-shadow,rgba(7,18,34,.16));color:var(--asset-border)}.primary{fill:var(--asset-primary)}.secondary{fill:var(--asset-secondary)}.accent{fill:var(--asset-accent)}.background{fill:var(--asset-background)}.border{stroke:var(--asset-border);stroke-width:5;stroke-linejoin:round}.outline{fill:none;stroke:currentColor;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}.detail{fill:none;stroke:currentColor;stroke-width:4;stroke-linecap:round}.current{color:var(--asset-border)}.shadow{fill:var(--asset-shadow)}.subtle{opacity:.2}</style>

