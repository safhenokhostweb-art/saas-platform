<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc" aria-label="برند شخصی حرفه‌ای"><title id="title">برند شخصی حرفه‌ای</title><desc id="desc">روایت مسیر رشد یک متخصص از هویت و مهارت‌ها تا تجربه، دستاورد و ارتباط حرفه‌ای.</desc>
<style id="asset-theme">:root{--asset-primary:#42c7b5;--asset-secondary:#1b3554;--asset-accent:#e4b94f;--asset-background:#f3f7f7;--asset-border:#17304d;color:var(--asset-border);--asset-current:currentColor}</style><style>:root{--primary:var(--asset-accent);--accent:var(--asset-primary);--ink:var(--asset-background);--muted:var(--asset-primary);--surface:var(--asset-border);--soft:var(--asset-border);--speed:9s}.panel{fill:var(--surface);stroke:var(--accent);stroke-width:1.5}.soft{fill:var(--soft);stroke:var(--accent);stroke-width:1.4}.primary{fill:none;stroke:var(--primary);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.accent{fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.muted-line{fill:none;stroke:var(--muted);stroke-width:1.4;stroke-linecap:round}.label{fill:var(--muted);font:12px Tahoma,Arial,sans-serif;text-anchor:middle}.small{fill:var(--ink);font:12px Tahoma,Arial,sans-serif}.tiny{fill:var(--muted);font:10px Tahoma,Arial,sans-serif}.copy{animation:copy var(--speed) ease-in-out infinite}@keyframes copy{0%,8%,96%,100%{opacity:.65;transform:translateX(5px)}20%,86%{opacity:1;transform:none}}.profile-card{animation:profile var(--speed) ease-in-out infinite}.avatar-bg{fill:var(--soft);stroke:var(--accent)}.profile-card .primary{fill:none;stroke:var(--primary);stroke-width:2}.contact{animation:contact 3.5s ease-in-out infinite}.timeline{fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:4 8}.milestone{animation:milestone var(--speed) ease-in-out infinite}.experience{animation-delay:-1.5s}.achievement{animation-delay:-3s}.dot{fill:var(--surface);stroke:var(--primary);stroke-width:3}.stars .primary,.achievement .primary,.experience .primary{fill:none;stroke:var(--primary);stroke-width:1.7}.medal{fill:var(--soft);stroke:var(--primary)}@keyframes profile{0%,100%{transform:translateY(4px)}50%{transform:translateY(-4px)}}@keyframes contact{50%{transform:translateY(-5px)}}@keyframes milestone{0%,100%{opacity:.72;transform:translateX(-4px)}35%,80%{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){*{animation:none!important}.smil{display:none}}</style><g class="personal-story">
<g class="profile-card" transform="translate(155 255)"><rect class="panel" x="-78" y="-130" width="156" height="260" rx="26"/><circle class="avatar-bg" cy="-55" r="46"/><circle class="primary" cy="-68" r="18"/><path class="primary" d="M-35-19c4-23 15-34 35-34s31 11 35 34"/><path class="muted-line" d="M-48 15h96M-36 35h72"/><g class="contact"><rect class="soft" x="-48" y="61" width="96" height="35" rx="10"/><path class="accent" d="M-28 74h56M-28 84h37"/></g><text class="label" y="154">پروفایل متخصص</text></g>
<path class="timeline" d="M315 105V425"/>
<g class="milestone skill" transform="translate(315 130)"><circle class="dot" r="12"/><rect class="panel" x="32" y="-35" width="190" height="70" rx="16"/><path class="accent" d="M55-8h50M55 8h87"/><g class="stars"><path class="primary" d="m176 0 6-12 6 12 13 2-10 9 3 13-12-7-12 7 3-13-10-9z"/></g><text class="small" x="54" y="-16">مهارت‌های تخصصی</text></g>
<g class="milestone experience" transform="translate(315 255)"><circle class="dot" r="12"/><rect class="panel" x="32" y="-35" width="190" height="70" rx="16"/><path class="primary" d="M57 12V-12h34v24M50 12h48M67-12v-10h14v10"/><text class="small" x="113" y="-6">تجربه حرفه‌ای</text><text class="tiny" x="113" y="13">پروژه‌ها و سوابق منتخب</text></g>
<g class="milestone achievement" transform="translate(315 380)"><circle class="dot" r="12"/><rect class="panel" x="32" y="-35" width="190" height="70" rx="16"/><circle class="medal" cx="70" r="20"/><path class="primary" d="m70-10 4 8 9 1-7 7 2 9-8-5-8 5 2-9-7-7 9-1zM62-18l-7-15m23 15 7-15"/><text class="small" x="117" y="-4">دستاورد و اعتماد</text></g>
<g class="smil"><circle cx="315" r="5" fill="var(--primary)"><animate attributeName="cy" values="105;425;105" dur="7s" repeatCount="indefinite"/></circle></g></g><g class="copy" direction="rtl" text-anchor="end" font-family="Tahoma,Arial,sans-serif"><rect x="680" y="168" width="4" height="102" rx="2" fill="var(--primary)"/><text x="900" y="208" fill="var(--ink)" font-size="28" font-weight="700">برند شخصی حرفه‌ای</text><text x="900" y="247" fill="var(--muted)" font-size="15">هویت، تخصص و دستاوردهای حرفه‌ای</text><path d="M900 298H752" fill="none" stroke="var(--accent)" stroke-width="1.5"/><circle cx="752" cy="298" r="3" fill="var(--accent)"/><text x="900" y="334" fill="var(--muted)" font-size="12">expert portrait  •  skill badges  •  experience timeline</text></g></svg>
