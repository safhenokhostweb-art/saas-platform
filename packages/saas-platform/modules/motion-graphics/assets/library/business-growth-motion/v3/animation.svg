<svg xmlns="http://www.w3.org/2000/svg" direction="rtl" viewBox="0 0 960 540" role="img" aria-labelledby="title desc" aria-label="موشن رشد کسب‌وکار — گزارش فروش و تحلیل رشد"><title id="title">موشن رشد کسب‌وکار</title><desc id="desc">گزارش فروش نیم‌سال اول ۱۴۰۵ با ماه‌های شمسی از راست به چپ، خط روند در برابر هدف، کارت رشد فصلی، سهم بازار و اعلان سفارش جدید.</desc>
<style id="asset-theme">:root{--asset-primary:#059669;--asset-secondary:#4f46e5;--asset-accent:#f59e0b;--asset-background:#f3f7f5;--asset-border:#dbe6e1;--asset-surface:#ffffff;--asset-ink:#0f1f1a;--asset-muted:#5f736c;--asset-success:#059669;--asset-oncolor:#ffffff}@media (prefers-color-scheme:dark){:root{--asset-primary:#34d399;--asset-secondary:#818cf8;--asset-accent:#fbbf24;--asset-background:#0a1512;--asset-border:#1f3530;--asset-surface:#11211d;--asset-ink:#e3f1ec;--asset-muted:#8fa9a0;--asset-success:#34d399;--asset-oncolor:#ffffff}}</style>
<style>
.bg{fill:var(--asset-background)}.dot{fill:var(--asset-border)}
.s-p{stop-color:var(--asset-primary)}.s-a{stop-color:var(--asset-accent)}.s-s{stop-color:var(--asset-secondary)}
.surface{fill:var(--asset-surface);stroke:var(--asset-border);stroke-width:1.2}
.soft{fill:var(--asset-background)}.shadow{fill:var(--asset-ink);opacity:.07}
.axis{fill:none;stroke:var(--asset-muted);stroke-width:1.2;opacity:.5}.line{fill:none;stroke:var(--asset-border);stroke-width:1}
.pri{fill:var(--asset-primary)}.acc{fill:var(--asset-accent)}.sec{fill:var(--asset-secondary)}
.bar{fill:var(--asset-primary);opacity:.32}.bar-top{fill:url(#bg-bar)}
.tint{fill:var(--asset-primary);opacity:.13}.tint-acc{fill:var(--asset-accent);opacity:.18}.tint-sec{fill:var(--asset-secondary);opacity:.14}
.trend{fill:none;stroke:var(--asset-secondary);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.target{fill:none;stroke:var(--asset-accent);stroke-width:2;stroke-dasharray:6 6;stroke-linecap:round}
.spark{fill:none;stroke:var(--asset-primary);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.track{fill:none;stroke:var(--asset-border);stroke-width:14}
.share{fill:none;stroke:var(--asset-primary);stroke-width:14;stroke-linecap:round;stroke-dasharray:var(--p-share_percent,36) var(--p-share_percent-rest,64)}
.ic{fill:none;stroke:var(--asset-primary);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}.ic-acc{stroke:var(--asset-accent)}.ic-sec{stroke:var(--asset-secondary)}
.pt{fill:var(--asset-surface);stroke:var(--asset-secondary);stroke-width:2.6}
.t{direction:rtl;font-family:'Vazirmatn',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;fill:var(--asset-ink)}
.h{font-size:16px;font-weight:800}.l{font-size:11px;fill:var(--asset-muted)}.c{font-size:12px;font-weight:700}.m{font-size:11px;fill:var(--asset-muted)}
.big{font-size:34px;font-weight:800;fill:var(--asset-primary)}.v{font-size:26px;font-weight:800}.b{font-weight:800;fill:var(--asset-ink)}
.tip{font-size:12px;font-weight:800;fill:var(--asset-oncolor)}
.g{transform-box:fill-box;transform-origin:center}
.card{animation:rise calc(.9s*var(--k,1)) cubic-bezier(.2,.8,.2,1) both}
.grow{transform-box:fill-box;transform-origin:50% 100%;animation:grow calc(.8s*var(--k,1)) cubic-bezier(.2,.9,.3,1.1) both}
.b1{animation-delay:calc(.5s*var(--k,1))}.b2{animation-delay:calc(.62s*var(--k,1))}.b3{animation-delay:calc(.74s*var(--k,1))}.b4{animation-delay:calc(.86s*var(--k,1))}.b5{animation-delay:calc(.98s*var(--k,1))}.b6{animation-delay:calc(1.1s*var(--k,1))}
.draw{stroke-dasharray:100;animation:draw calc(1.5s*var(--k,1)) calc(1.3s*var(--k,1)) cubic-bezier(.4,0,.2,1) both}
.fade{animation:fade calc(.9s*var(--k,1)) calc(1.2s*var(--k,1)) ease-out both}.fade2{animation:fade calc(.9s*var(--k,1)) calc(1.9s*var(--k,1)) ease-out both}
.pop{animation:pop calc(.45s*var(--k,1)) cubic-bezier(.2,.9,.3,1.4) both}.p1{animation-delay:calc(1.45s*var(--k,1))}.p2{animation-delay:calc(1.65s*var(--k,1))}.p3{animation-delay:calc(1.85s*var(--k,1))}.p4{animation-delay:calc(2.05s*var(--k,1))}.p5{animation-delay:calc(2.25s*var(--k,1))}.p6{animation-delay:calc(2.45s*var(--k,1))}
.bubble{animation:pop calc(.5s*var(--k,1)) calc(2.6s*var(--k,1)) cubic-bezier(.2,.9,.3,1.4) both}
.in-l{animation:inL calc(.8s*var(--k,1)) cubic-bezier(.2,.8,.2,1) both}.d1{animation-delay:calc(.35s*var(--k,1))}.d2{animation-delay:calc(.6s*var(--k,1))}
.spark-d{stroke-dasharray:100;animation:draw calc(1.2s*var(--k,1)) calc(1s*var(--k,1)) ease-out both}
.sweep{animation:sweep calc(1.4s*var(--k,1)) calc(1.1s*var(--k,1)) cubic-bezier(.4,0,.2,1) both}
.float{animation:float calc(6s*var(--k,1)) ease-in-out infinite}.f2{animation-duration:calc(7.5s*var(--k,1));animation-delay:calc(-3s*var(--k,1))}
.bob{animation:bob calc(2.4s*var(--k,1)) ease-in-out infinite}
.hl{animation:hl calc(3.2s*var(--k,1)) calc(2.8s*var(--k,1)) ease-in-out infinite}
.live{animation:pulse calc(2.2s*var(--k,1)) calc(2.8s*var(--k,1)) ease-out infinite;opacity:0}
.glow{animation:breathe calc(9s*var(--k,1)) ease-in-out infinite}.glow2{animation-delay:calc(-4.5s*var(--k,1))}
.toast{animation:toast calc(9s*var(--k,1)) calc(3s*var(--k,1)) cubic-bezier(.2,.8,.2,1) infinite}
.coin{opacity:0;animation:coin calc(6s*var(--k,1)) ease-in infinite}.c2{animation-delay:calc(-1.5s*var(--k,1))}.c3{animation-delay:calc(-3s*var(--k,1))}.c4{animation-delay:calc(-4.5s*var(--k,1))}
@keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleY(0)}to{transform:none}}
@keyframes draw{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-36px)}to{opacity:1;transform:none}}
@keyframes sweep{from{stroke-dasharray:0 100}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes hl{0%,100%{opacity:1}50%{opacity:.72}}
@keyframes pulse{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(3.4)}}
@keyframes breathe{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:.9;transform:scale(1.07)}}
@keyframes toast{0%{opacity:0;transform:translateX(-40px)}7%,72%{opacity:1;transform:none}80%,100%{opacity:0;transform:translateX(-40px)}}
@keyframes coin{0%{opacity:0;transform:translateY(0)}20%{opacity:.8}100%{opacity:0;transform:translateY(-70px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<pattern id="bg-dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle class="dot" cx="2" cy="2" r="1.2"/></pattern>
<radialGradient id="bg-glow-a"><stop offset="0" class="s-p" stop-opacity=".28"/><stop offset="1" class="s-p" stop-opacity="0"/></radialGradient>
<radialGradient id="bg-glow-b"><stop offset="0" class="s-a" stop-opacity=".24"/><stop offset="1" class="s-a" stop-opacity="0"/></radialGradient>
<linearGradient id="bg-bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="s-p"/><stop offset="1" class="s-p" stop-opacity=".55"/></linearGradient>
</defs>
