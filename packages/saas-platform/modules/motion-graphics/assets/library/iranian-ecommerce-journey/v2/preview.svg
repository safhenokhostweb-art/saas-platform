<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc" aria-label="سفر مشتری فروشگاه اینترنتی"><title id="title">پیش‌نمایش سفر مشتری فروشگاه اینترنتی</title><desc id="desc">روایت مرحله‌ای خرید آنلاین از مشاهده محصول تا پرداخت امن، ارسال و رضایت مشتری.</desc>
<style id="asset-theme">:root{--asset-primary:#42c7b5;--asset-secondary:#1b3554;--asset-accent:#e4b94f;--asset-background:#f3f7f7;--asset-border:#17304d;color:var(--asset-border);--asset-current:currentColor}</style><style>:root{--primary:var(--asset-accent);--accent:var(--asset-primary);--ink:var(--asset-background);--muted:var(--asset-primary);--surface:var(--asset-border);--soft:var(--asset-border);--speed:9s}.panel{fill:var(--surface);stroke:var(--accent);stroke-width:1.5}.soft{fill:var(--soft);stroke:var(--accent);stroke-width:1.4}.primary{fill:none;stroke:var(--primary);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.accent{fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.muted-line{fill:none;stroke:var(--muted);stroke-width:1.4;stroke-linecap:round}.label{fill:var(--muted);font:12px Tahoma,Arial,sans-serif;text-anchor:middle}.small{fill:var(--ink);font:12px Tahoma,Arial,sans-serif}.tiny{fill:var(--muted);font:10px Tahoma,Arial,sans-serif}.copy{animation:copy var(--speed) ease-in-out infinite}@keyframes copy{0%,8%,96%,100%{opacity:.65;transform:translateX(5px)}20%,86%{opacity:1;transform:none}}.journey-line{fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:7 10;animation:route 3s linear infinite}.step{animation:stepIn var(--speed) ease-in-out infinite}.product{animation-delay:0s}.cart-step{animation-delay:-1s}.payment{animation-delay:-2s}.delivery{animation-delay:-3s}.customer{animation-delay:-4s}.step-bg{fill:var(--surface);stroke:var(--accent);stroke-width:2}.lock{fill:var(--surface);stroke:var(--accent)}.truck{fill:none;stroke:var(--primary);stroke-width:2;stroke-linejoin:round}.customer .primary{fill:none;stroke:var(--primary);stroke-width:2}.product .accent{fill:none}.cart-step .primary{fill:none;stroke:var(--primary);stroke-width:2}.payment .accent{fill:none}.delivery{animation-name:delivery}.customer{animation-name:happy}@keyframes route{to{stroke-dashoffset:-34}}@keyframes stepIn{0%,100%{opacity:.72;transform:translateY(3px)}35%,80%{opacity:1;transform:none}}@keyframes delivery{0%,100%{transform:translateX(-4px)}50%{transform:translateX(5px)}}@keyframes happy{0%,100%{transform:scale(.96)}50%{transform:scale(1.03)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}.smil{display:none}}*{animation:none!important}.smil{display:none}</style><rect width="960" height="540" rx="28" fill="var(--asset-border)"/><g class="shopping-journey">
<path id="journey" class="journey-line" d="M95 305C185 220 255 220 330 305S485 390 560 305 700 220 790 305"/>
<g class="step product" transform="translate(110 285)"><rect class="panel" x="-50" y="-82" width="100" height="126" rx="16"/><rect class="soft" x="-30" y="-61" width="60" height="55" rx="8"/><path class="accent" d="m0-50 20 10v20L0-10l-20-10v-20zM-20-40 0-30l20-10"/><path class="muted-line" d="M-29 10h58M-29 22h38"/><text class="label" y="67">انتخاب محصول</text></g>
<g class="step cart-step" transform="translate(285 305)"><circle class="step-bg" r="42"/><path class="primary" d="M-25-17h8l6 28h27l7-18h-37M-6 19a5 5 0 1 0 0 10 5 5 0 0 0 0-10m21 0a5 5 0 1 0 0 10 5 5 0 0 0 0-10"/><text class="label" y="67">سبد خرید</text></g>
<g class="step payment" transform="translate(450 355)"><rect class="panel" x="-52" y="-36" width="104" height="72" rx="14"/><path class="muted-line" d="M-52-14h104M-35 15h25"/><rect class="lock" x="16" y="-4" width="23" height="21" rx="4"/><path class="accent" d="M21-4v-7a7 7 0 0 1 14 0v7"/><text class="label" y="60">پرداخت امن</text></g>
<g class="step delivery" transform="translate(620 285)"><path class="primary truck" d="M-48 15h58v-42h-58zm58-25h24l17 19v6H10zM-30 29a9 9 0 1 0 0-18 9 9 0 0 0 0 18m61 0a9 9 0 1 0 0-18 9 9 0 0 0 0 18"/><text class="label" y="58">ارسال کالا</text></g>
<g class="step customer" transform="translate(790 305)"><circle class="step-bg" r="46"/><circle class="primary" cy="-12" r="14"/><path class="primary" d="M-27 30c3-18 12-27 27-27s24 9 27 27M-10-12h4m12 0h4M-9-3c6 7 12 7 18 0"/><text class="label" y="70">مشتری راضی</text></g>
<g class="smil"><circle r="5" fill="var(--primary)"><animateMotion dur="6s" repeatCount="indefinite"><mpath href="#journey"/></animateMotion></circle></g></g><g class="copy" direction="rtl" text-anchor="end" font-family="Tahoma,Arial,sans-serif"><rect x="680" y="168" width="4" height="102" rx="2" fill="var(--primary)"/><text x="900" y="208" fill="var(--ink)" font-size="28" font-weight="700">سفر مشتری فروشگاه اینترنتی</text><text x="900" y="247" fill="var(--muted)" font-size="15">از انتخاب محصول تا تحویل رضایت‌بخش</text><path d="M900 298H752" fill="none" stroke="var(--accent)" stroke-width="1.5"/><circle cx="752" cy="298" r="3" fill="var(--accent)"/><text x="900" y="334" fill="var(--muted)" font-size="12">product card  •  moving cart  •  secure payment</text></g></svg>
