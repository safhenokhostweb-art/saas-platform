<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc" aria-label="موشن قهرمان سازمانی — اعتماد، نوآوری و فناوری"><title id="title">موشن قهرمان سازمانی</title><desc id="desc">داشبورد هوشمند سازمان با نمودار رشد، کارت امنیت و اعتماد، پایداری سرویس و پشتیبانی شبانه‌روزی؛ چیدمان راست‌به‌چپ.</desc>
<style id="asset-theme">:root{--asset-primary:#2563eb;--asset-secondary:#0ea5e9;--asset-accent:#f59e0b;--asset-background:#f4f7fc;--asset-border:#dbe4f3;--asset-surface:#ffffff;--asset-ink:#0f172a;--asset-muted:#64748b;--asset-success:#10b981}@media (prefers-color-scheme:dark){:root{--asset-primary:#60a5fa;--asset-secondary:#38bdf8;--asset-accent:#fbbf24;--asset-background:#0b1220;--asset-border:#24324f;--asset-surface:#131d34;--asset-ink:#e6edf8;--asset-muted:#8ea0bf;--asset-success:#34d399}}</style>
<style>
.bg{fill:var(--asset-background)}.dot{fill:var(--asset-border)}
.s-p{stop-color:var(--asset-primary)}.s-s{stop-color:var(--asset-secondary)}.s-bg{stop-color:var(--asset-background)}
.surface{fill:var(--asset-surface);stroke:var(--asset-border);stroke-width:1.2}
.soft{fill:var(--asset-background)}.shadow{fill:var(--asset-ink);opacity:.07}
.line{fill:none;stroke:var(--asset-border);stroke-width:1}
.ring{fill:none;stroke:var(--asset-border);stroke-width:1.2;stroke-dasharray:3 7}
.node{fill:var(--asset-primary)}.node2{fill:var(--asset-secondary)}.node3{fill:var(--asset-accent)}
.pri{fill:var(--asset-primary)}.sec{fill:var(--asset-secondary)}.acc{fill:var(--asset-accent)}.ok{fill:var(--asset-success)}
.tint{fill:var(--asset-primary);opacity:.12}.tint-ok{fill:var(--asset-success);opacity:.14}.tint-acc{fill:var(--asset-accent);opacity:.16}.tint-sec{fill:var(--asset-secondary);opacity:.14}
.bar{fill:var(--asset-border)}
.stroke-pri{fill:none;stroke:var(--asset-primary);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.stroke-ok{fill:none;stroke:var(--asset-success);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.stroke-sec{fill:none;stroke:var(--asset-secondary);stroke-width:2;stroke-linejoin:round}.thin{stroke-width:1.6}.stroke-w{fill:none;stroke:var(--asset-surface);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.wire{fill:none;stroke:var(--asset-primary);stroke-width:1.2;stroke-dasharray:2 6;opacity:.45}
.t{direction:rtl;font-family:Vazirmatn,"IRANSans",Tahoma,Arial,sans-serif;fill:var(--asset-ink)}
.h{font-size:13px;font-weight:700}.l{font-size:11px;fill:var(--asset-muted)}.v{font-size:17px;font-weight:800}.c{font-size:12px;font-weight:700}
.g{transform-box:fill-box;transform-origin:center}
.win{animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
.tile{animation:pop .6s cubic-bezier(.2,.9,.3,1.2) both}.t1{animation-delay:.45s}.t2{animation-delay:.6s}.t3{animation-delay:.75s}
.draw{stroke-dasharray:100;animation:draw 1.6s .9s cubic-bezier(.4,0,.2,1) both}
.area{animation:fade 1s 1.5s ease-out both}
.check{stroke-dasharray:100;animation:draw .8s 1.6s ease-out both}
.in-r{animation:inR .8s cubic-bezier(.2,.8,.2,1) both}.in-l{animation:inL .8s cubic-bezier(.2,.8,.2,1) both}
.d1{animation-delay:1.1s}.d2{animation-delay:1.3s}.d3{animation-delay:1.5s}.d4{animation-delay:1.7s}
.float{animation:float 6s ease-in-out infinite}.f2{animation-duration:7s;animation-delay:-2s}.f3{animation-duration:8s;animation-delay:-4s}.f4{animation-duration:6.5s;animation-delay:-1s}
.orbit{transform-box:view-box;transform-origin:480px 270px;animation:spin 60s linear infinite}.orbit2{transform-box:view-box;transform-origin:480px 270px;animation:spin 90s linear infinite reverse}
.glow{animation:breathe 8s ease-in-out infinite}.glow2{animation-delay:-4s}
.live{animation:pulse 2.2s ease-out infinite}
.pk{opacity:0;animation:packet 4s linear infinite}.pk1{--dx:54px;--dy:20px}.pk2{--dx:-44px;--dy:14px;animation-delay:-1s}.pk3{--dx:54px;--dy:-22px;animation-delay:-2s}.pk4{--dx:-38px;--dy:-16px;animation-delay:-3s}
.scan{animation:scan 5s 2.6s ease-in-out infinite;opacity:0}
.active{animation:blink 4s 2s ease-in-out infinite}
@keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.86)}to{opacity:1;transform:none}}
@keyframes draw{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes inR{from{opacity:0;transform:translateX(36px)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-36px)}to{opacity:1;transform:none}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:.9;transform:scale(1.06)}}
@keyframes pulse{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(3.2)}}
@keyframes packet{0%{opacity:0;transform:translate(0,0)}12%{opacity:1}80%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy))}}
@keyframes scan{0%{opacity:0;transform:translateX(0)}15%{opacity:.5}70%{opacity:.5}100%{opacity:0;transform:translateX(-300px)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.55}}
*{animation:none!important}
</style>
<defs>
<pattern id="hm-dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle class="dot" cx="2" cy="2" r="1.2"/></pattern>
<radialGradient id="hm-glow-a"><stop offset="0" class="s-p" stop-opacity=".30"/><stop offset="1" class="s-p" stop-opacity="0"/></radialGradient>
<radialGradient id="hm-glow-b"><stop offset="0" class="s-s" stop-opacity=".26"/><stop offset="1" class="s-s" stop-opacity="0"/></radialGradient>
<linearGradient id="hm-area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="s-p" stop-opacity=".28"/><stop offset="1" class="s-p" stop-opacity="0"/></linearGradient>
<linearGradient id="hm-scan" x1="0" y1="0" x2="1" y2="0"><stop offset="0" class="s-s" stop-opacity="0"/><stop offset=".5" class="s-s" stop-opacity=".35"/><stop offset="1" class="s-s" stop-opacity="0"/></linearGradient>
<linearGradient id="hm-cta" x1="1" y1="0" x2="0" y2="1"><stop offset="0" class="s-p"/><stop offset="1" class="s-s"/></linearGradient>
</defs>
