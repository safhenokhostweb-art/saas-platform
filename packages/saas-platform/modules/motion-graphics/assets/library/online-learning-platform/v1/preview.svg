<style id="asset-theme">:root{--asset-primary:#42c7b5;--asset-secondary:#1b3554;--asset-accent:#e4b94f;--asset-background:#f3f7f7;--asset-border:#17304d;color:var(--asset-border);--asset-current:currentColor}</style><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="var(--asset-border)"/><stop offset="1" stop-color="var(--asset-border)"/></linearGradient></defs><rect width="960" height="540" rx="28" fill="url(#bg)"/><g fill="none" stroke="var(--asset-primary)" stroke-width="1.5" opacity=".55"><path d="M360 270 150 112M360 270 105 275M360 270 175 435M360 270 535 112M360 270 555 432"/></g><g fill="var(--asset-border)" stroke="var(--asset-primary)"><circle cx="150" cy="112" r="26"/><circle cx="105" cy="275" r="26"/><circle cx="175" cy="435" r="26"/><circle cx="535" cy="112" r="26"/><circle cx="555" cy="432" r="26"/></g><circle cx="360" cy="270" r="67" fill="none" stroke="var(--asset-secondary)" stroke-opacity=".3"/><rect x="315" y="225" width="90" height="90" rx="25" fill="var(--asset-border)" stroke="var(--asset-secondary)" stroke-width="2"/><g transform="translate(360 270)" fill="none" stroke="var(--asset-secondary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="-31" y="-27" width="62" height="43" rx="6"/><path d="M-18 29h36M0 16v13M-13-12h26M-13-2h18M-20 6h8m6 0h20" /></g><g direction="rtl" text-anchor="end" font-family="Tahoma,Arial,sans-serif"><rect x="680" y="168" width="4" height="102" rx="2" fill="var(--asset-secondary)"/><text x="900" y="208" fill="var(--asset-background)" font-size="28" font-weight="700">آموزش و یادگیری آنلاین</text><text x="900" y="247" fill="var(--asset-primary)" font-size="15">یادگیری تعاملی و دسترسی پیوسته به دانش</text><text x="900" y="335" fill="var(--asset-primary)" font-size="13">دانش‌پذیران  •  دوره‌ها  •  اشتراک دانش</text></g></svg>
