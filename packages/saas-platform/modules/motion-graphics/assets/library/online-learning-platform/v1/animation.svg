<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc" aria-label="آموزش و یادگیری آنلاین">
<title id="title">آموزش و یادگیری آنلاین</title><desc id="desc">نمایش مدرس، دانش‌پذیران، دوره‌های آنلاین و جریان اشتراک دانش در یک پلتفرم آموزشی.</desc>
<style id="asset-theme">:root{--asset-primary:#42c7b5;--asset-secondary:#1b3554;--asset-accent:#e4b94f;--asset-background:#f3f7f7;--asset-border:#17304d;color:var(--asset-border);--asset-current:currentColor}</style>
<style>:root{--p:var(--asset-secondary);--a:var(--asset-primary);--ink:var(--asset-background);--muted:var(--asset-primary);--surface:var(--asset-border);--speed:9s}.scene{animation:intro var(--speed) ease-in-out infinite;transform-origin:center}.wire{fill:none;stroke:url(#line);stroke-width:1.5;stroke-linecap:round;stroke-dasharray:6 10;animation:flow 3.8s linear infinite}.card{animation:float var(--speed) ease-in-out infinite;transform-box:fill-box;transform-origin:center}.c2{animation-delay:-1.4s}.c3{animation-delay:-2.8s}.c4{animation-delay:-4.2s}.c5{animation-delay:-5.6s}.card rect{fill:var(--surface);stroke:var(--a);stroke-opacity:.68}.icon{fill:none;stroke:var(--a);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.card text{fill:var(--muted);font:11px Tahoma,Arial,sans-serif;text-anchor:middle}.core{fill:var(--surface);stroke:var(--p);stroke-width:2}.main{fill:none;stroke:var(--p);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.ring{animation:ring var(--speed) ease-in-out infinite;transform-box:fill-box;transform-origin:center}.copy{animation:copy var(--speed) ease-in-out infinite}@keyframes intro{0%,100%{opacity:.72;transform:translateY(4px)}15%,88%{opacity:1;transform:none}}@keyframes flow{to{stroke-dashoffset:-32}}@keyframes float{0%,100%{transform:translateY(3px)}50%{transform:translateY(-4px)}}@keyframes ring{0%,100%{opacity:.18;transform:scale(.82)}45%,72%{opacity:.62;transform:scale(1)}}@keyframes copy{0%,8%,96%,100%{opacity:.65;transform:translateX(5px)}20%,86%{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){*{animation:none!important}.wire{stroke-dasharray:none}.particles{display:none}}</style>
<defs><linearGradient id="line"><stop stop-color="var(--p)"/><stop offset="1" stop-color="var(--a)" stop-opacity=".4"/></linearGradient><path id="p1" d="M330 243C275 195 230 154 170 120"/><path id="p2" d="M322 270C250 270 190 271 125 275"/><path id="p3" d="M335 300C285 350 240 390 195 425"/><path id="p4" d="M385 243C430 195 475 155 520 122"/><path id="p5" d="M390 300C445 350 490 390 540 422"/></defs>
<g class="scene"><g opacity=".18" fill="none" stroke="var(--muted)"><circle cx="360" cy="270" r="150"/><circle cx="360" cy="270" r="205" stroke-dasharray="2 12"/></g><g><use href="#p1" class="wire"/><use href="#p2" class="wire"/><use href="#p3" class="wire"/><use href="#p4" class="wire"/><use href="#p5" class="wire"/></g>
<g class="ring" fill="none" stroke="var(--p)"><circle cx="360" cy="270" r="63" stroke-opacity=".32"/><circle cx="360" cy="270" r="78" stroke-opacity=".14"/></g>
<g transform="translate(360 270)"><rect class="core" x="-45" y="-45" width="90" height="90" rx="25"/><g class="main"><rect x="-31" y="-27" width="62" height="43" rx="6"/><path d="M-18 29h36M0 16v13M-13-12h26M-13-2h18M-20 6h8m6 0h20" /></g></g><g class="card c1" transform="translate(150 112)"><rect x="-57" y="-36" width="114" height="72" rx="17"/><g class="icon"><circle cy="-6" r="8"/><path d="M-17 15c2-10 8-15 17-15s15 5 17 15"/></g><text y="28">مدرس</text></g><g class="card c2" transform="translate(105 275)"><rect x="-57" y="-36" width="114" height="72" rx="17"/><g class="icon"><path d="M-17-12h34v24h-34zM-10-4h20M-10 3h14"/></g><text y="28">دانش‌پذیران</text></g><g class="card c3" transform="translate(175 435)"><rect x="-57" y="-36" width="114" height="72" rx="17"/><g class="icon"><path d="m0-17 18 9v18L0 18l-18-8V-8zM-18-8 0 1l18-9M0 1v17"/></g><text y="28">دوره‌ها</text></g><g class="card c4" transform="translate(535 112)"><rect x="-57" y="-36" width="114" height="72" rx="17"/><g class="icon"><path d="M-18 13-7 3l8 5 17-22M10-14h8v8"/></g><text y="28">اشتراک دانش</text></g><g class="card c5" transform="translate(555 432)"><rect x="-57" y="-36" width="114" height="72" rx="17"/><g class="icon"><path d="M-18 11c2-12 8-18 18-18s16 6 18 18M0-10a8 8 0 1 0 0-16 8 8 0 0 0 0 16M10-10l5 5 9-11"/></g><text y="28">پیشرفت</text></g>
<g class="particles" fill="var(--p)"><circle r="3"><animateMotion dur="3.7s" begin="-0s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion></circle><circle r="3"><animateMotion dur="3.85s" begin="-0.7s" repeatCount="indefinite"><mpath href="#p2"/></animateMotion></circle><circle r="3"><animateMotion dur="4s" begin="-1.4s" repeatCount="indefinite"><mpath href="#p3"/></animateMotion></circle><circle r="3"><animateMotion dur="4.15s" begin="-2.0999999999999996s" repeatCount="indefinite"><mpath href="#p4"/></animateMotion></circle><circle r="3"><animateMotion dur="4.3s" begin="-2.8s" repeatCount="indefinite"><mpath href="#p5"/></animateMotion></circle></g></g>
<g class="copy" direction="rtl" text-anchor="end" font-family="Tahoma,Arial,sans-serif"><rect x="680" y="168" width="4" height="102" rx="2" fill="var(--p)"/><text x="900" y="208" fill="var(--ink)" font-size="28" font-weight="700">آموزش و یادگیری آنلاین</text><text x="900" y="247" fill="var(--muted)" font-size="15">یادگیری تعاملی و دسترسی پیوسته به دانش</text><path d="M900 299H752" fill="none" stroke="var(--a)" stroke-width="1.5"/><circle cx="752" cy="299" r="3" fill="var(--a)"/><text x="900" y="335" fill="var(--muted)" font-size="13">دانش‌پذیران  •  دوره‌ها  •  اشتراک دانش</text></g></svg>
