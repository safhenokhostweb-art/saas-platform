<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc" aria-label="آموزش و یادگیری آنلاین"><title id="title">آموزش و یادگیری آنلاین</title><desc id="desc">روایت یادگیری دیجیتال با مدرس، کتاب باز، رابط دوره، دانش‌پذیر و مسیر پیشرفت.</desc>
<style id="asset-theme">:root{--asset-primary:#42c7b5;--asset-secondary:#1b3554;--asset-accent:#e4b94f;--asset-background:#f3f7f7;--asset-border:#17304d;color:var(--asset-border);--asset-current:currentColor}</style><style>:root{--primary:var(--asset-secondary);--accent:var(--asset-primary);--ink:var(--asset-background);--muted:var(--asset-primary);--surface:var(--asset-border);--soft:var(--asset-border);--speed:9s}.panel{fill:var(--surface);stroke:var(--accent);stroke-width:1.5}.soft{fill:var(--soft);stroke:var(--accent);stroke-width:1.3}.primary{fill:none;stroke:var(--primary);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.accent{fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round}.muted-line{fill:none;stroke:var(--muted);stroke-width:1.4;stroke-linecap:round}.label{fill:var(--muted);font:12px Tahoma,Arial,sans-serif;text-anchor:middle}.small{fill:var(--ink);font:12px Tahoma,Arial,sans-serif}.tiny{fill:var(--muted);font:10px Tahoma,Arial,sans-serif}.copy{animation:copy var(--speed) ease-in-out infinite}@keyframes copy{0%,8%,96%,100%{opacity:.65;transform:translateX(5px)}20%,86%{opacity:1;transform:none}}.book-page{fill:var(--surface);stroke:var(--primary);stroke-width:2}.left-page{animation:pageLeft 5s ease-in-out infinite;transform-origin:85px 0}.right-page{animation:pageRight 5s ease-in-out infinite;transform-origin:-85px 0}.class-screen{animation:screen var(--speed) ease-in-out infinite}.class-screen .primary,.student .primary{fill:none;stroke:var(--primary);stroke-width:2}.course-card{animation:course 3.5s ease-in-out infinite}.desk{fill:var(--soft);stroke:var(--accent)}.portrait{fill:var(--surface);stroke:var(--primary);stroke-width:2}.knowledge-path{fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:5 9;animation:dash 2s linear infinite}.progress-fill{fill:var(--accent);animation:progress 4s ease-in-out infinite}.progress{animation:progressCard var(--speed) ease-in-out infinite}@keyframes pageLeft{50%{transform:skewY(-3deg)}}@keyframes pageRight{50%{transform:skewY(3deg)}}@keyframes screen{0%,100%{transform:translateY(3px)}50%{transform:translateY(-4px)}}@keyframes course{50%{transform:translateX(7px)}}@keyframes dash{to{stroke-dashoffset:-28}}@keyframes progress{0%,100%{width:55px}60%,85%{width:118px}}@keyframes progressCard{0%,100%{opacity:.75}50%{opacity:1}}@media(prefers-reduced-motion:reduce){*{animation:none!important}.smil{display:none}}</style><g class="learning-scene">
<g class="book" transform="translate(85 350)"><path class="book-page left-page" d="M0 0c45-23 90-21 130 5v95C88 74 44 77 0 100z"/><path class="book-page right-page" d="M0 0c-45-23-90-21-130 5v95c42-26 86-23 130 0z"/><path class="muted-line" d="M-110 25c34-10 66-8 92 7M-110 46c34-10 66-8 92 7M18 32c28-15 58-16 92-7M18 53c28-15 58-16 92-7"/><text class="label" y="128">منبع دانش</text></g>
<g class="class-screen" transform="translate(300 95)"><rect class="panel" width="280" height="210" rx="22"/><rect class="soft" x="22" y="22" width="112" height="112" rx="16"/><circle class="primary" cx="78" cy="58" r="20"/><path class="primary" d="M45 116c4-26 15-39 33-39s29 13 33 39"/><path class="accent" d="M158 45h92M158 70h68M158 95h82"/><g class="course-card"><rect class="soft" x="157" y="126" width="94" height="52" rx="10"/><path class="accent" d="M172 142h63M172 158h42"/></g><text class="small" x="22" y="196">کلاس آنلاین</text></g>
<g class="student" transform="translate(455 380)"><rect class="desk" x="-85" y="20" width="170" height="18" rx="7"/><rect class="soft laptop" x="-52" y="-42" width="104" height="62" rx="8"/><path class="accent" d="M-28-13h56M-28 1h36"/><circle class="portrait" cy="-80" r="22"/><path class="primary" d="M-40-45c4-23 17-35 40-35s36 12 40 35"/><text class="label" y="66">دانش‌پذیر</text></g>
<path id="knowledge-path" class="knowledge-path" d="M205 355C260 330 275 280 300 240"/>
<g class="progress" transform="translate(70 100)"><rect class="panel" width="170" height="72" rx="16"/><text class="small" x="18" y="28">پیشرفت دوره</text><rect class="soft" x="18" y="43" width="134" height="12" rx="6"/><rect class="progress-fill" x="18" y="43" width="98" height="12" rx="6"/></g>
<g class="smil"><circle r="5" fill="var(--primary)"><animateMotion dur="3s" repeatCount="indefinite"><mpath href="#knowledge-path"/></animateMotion></circle></g></g><g class="copy" direction="rtl" text-anchor="end" font-family="Tahoma,Arial,sans-serif"><rect x="680" y="168" width="4" height="102" rx="2" fill="var(--primary)"/><text x="900" y="208" fill="var(--ink)" font-size="28" font-weight="700">آموزش و یادگیری آنلاین</text><text x="900" y="247" fill="var(--muted)" font-size="15">از دانش تا تجربه یادگیری تعاملی</text><path d="M900 298H752" fill="none" stroke="var(--accent)" stroke-width="1.5"/><text x="900" y="334" fill="var(--muted)" font-size="12">open book  •  teacher screen  •  course cards</text></g></svg>
