<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title description" aria-label="معرفی حرفه‌ای شرکت ایرانی">
  <title id="title">معرفی حرفه‌ای شرکت ایرانی</title>
  <desc id="description">یک شرکت ایرانی در مرکز شبکه‌ای از تیم، خدمات، محصولات، مشتریان و شاخص رشد قرار دارد.</desc>
<style id="asset-theme">:root{--asset-primary:#42c7b5;--asset-secondary:#1b3554;--asset-accent:#e4b94f;--asset-background:#f3f7f7;--asset-border:#17304d;color:var(--asset-border);--asset-current:currentColor}</style>
  <style>
    :root{--company-primary:var(--asset-accent);--company-accent:var(--asset-primary);--company-ink:var(--asset-background);--company-muted:var(--asset-primary);--company-surface:var(--asset-border);--company-speed:9s}
    .scene{transform-origin:center;animation:entrance var(--company-speed) ease-in-out infinite}
    .wire{fill:none;stroke:url(#wire);stroke-width:1.5;stroke-linecap:round;stroke-dasharray:5 9;animation:signal calc(var(--company-speed)*.42) linear infinite}
    .card{transform-box:fill-box;transform-origin:center;animation:float var(--company-speed) ease-in-out infinite}
    .card-2{animation-delay:-1.4s}.card-3{animation-delay:-2.8s}.card-4{animation-delay:-4.2s}.card-5{animation-delay:-5.6s}
    .core-ring{transform-box:fill-box;transform-origin:center;animation:ring var(--company-speed) ease-out infinite}
    .chart{stroke-dasharray:80;stroke-dashoffset:80;animation:chart var(--company-speed) ease-in-out infinite}
    .copy{animation:copy var(--company-speed) ease-in-out infinite}
    @keyframes entrance{0%,100%{opacity:.7;transform:translateY(5px) scale(.985)}14%,88%{opacity:1;transform:none}}
    @keyframes signal{to{stroke-dashoffset:-28}}
    @keyframes float{0%,100%{transform:translateY(3px)}50%{transform:translateY(-4px)}}
    @keyframes ring{0%,100%{opacity:.18;transform:scale(.82)}45%,72%{opacity:.65;transform:scale(1)}}
    @keyframes chart{0%,12%,100%{stroke-dashoffset:80}35%,84%{stroke-dashoffset:0}}
    @keyframes copy{0%,8%,96%,100%{opacity:.65;transform:translateX(5px)}20%,86%{opacity:1;transform:none}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important}.wire{stroke-dasharray:none}.chart{stroke-dashoffset:0}.particles{display:none}}
  </style>
  <defs>
    <linearGradient id="wire" x1="0" y1="0" x2="1" y2="1"><stop stop-color="var(--company-primary)"/><stop offset="1" stop-color="var(--company-accent)" stop-opacity=".45"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="var(--company-surface)"/><stop offset="1" stop-color="var(--asset-border)"/></linearGradient>
    <path id="teamPath" d="M337 240C290 196 245 158 194 126"/><path id="servicePath" d="M326 270C261 267 210 266 153 272"/><path id="productPath" d="M340 302C299 346 258 386 205 420"/><path id="growthPath" d="M383 241C424 196 465 159 521 130"/><path id="customerPath" d="M387 297C434 342 476 382 530 416"/>
  </defs>

  <g class="scene">
    <g opacity=".18" fill="none" stroke="var(--company-muted)"><circle cx="360" cy="270" r="148"/><circle cx="360" cy="270" r="203" stroke-dasharray="2 12"/></g>
    <g><use href="#teamPath" class="wire"/><use href="#servicePath" class="wire"/><use href="#productPath" class="wire"/><use href="#growthPath" class="wire"/><use href="#customerPath" class="wire"/></g>

    <g class="core-ring" fill="none" stroke="var(--company-primary)"><circle cx="360" cy="270" r="63" stroke-opacity=".35"/><circle cx="360" cy="270" r="78" stroke-opacity=".16"/></g>
    <g transform="translate(360 270)">
      <rect x="-43" y="-43" width="86" height="86" rx="24" fill="url(#panel)" stroke="var(--company-primary)" stroke-width="2"/>
      <path d="M-22 20V-17L0-29l22 12v37M-27 20h54M-12 20V3h24v17M-13-10h4m7 0h4m7 0h4" fill="none" stroke="var(--company-primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <g font-family="Tahoma,Arial,sans-serif" font-size="11" text-anchor="middle">
      <g class="card card-1" transform="translate(175 110)"><rect x="-55" y="-35" width="110" height="70" rx="17" fill="url(#panel)" stroke="var(--company-accent)" stroke-opacity=".7"/><g fill="none" stroke="var(--company-accent)" stroke-width="1.7"><circle cx="-10" cy="-8" r="7"/><circle cx="10" cy="-8" r="7"/><path d="M-23 11c2-8 7-12 13-12S1 3 3 11M-3 11c2-8 7-12 13-12s11 4 13 12"/></g><text y="26" fill="var(--company-muted)">تیم حرفه‌ای</text></g>
      <g class="card card-2" transform="translate(125 273)"><rect x="-55" y="-35" width="110" height="70" rx="17" fill="url(#panel)" stroke="var(--company-accent)" stroke-opacity=".7"/><g fill="none" stroke="var(--company-accent)" stroke-width="1.8"><path d="M-18-11h36v22h-36zM-10-3h20M-10 4h13"/></g><text y="27" fill="var(--company-muted)">خدمات شرکت</text></g>
      <g class="card card-3" transform="translate(184 435)"><rect x="-55" y="-35" width="110" height="70" rx="17" fill="url(#panel)" stroke="var(--company-accent)" stroke-opacity=".7"/><g fill="none" stroke="var(--company-accent)" stroke-width="1.7"><path d="m0-18 19 9v19L0 19l-19-9V-9zM-19-9 0 1l19-10M0 1v18"/></g><text y="28" fill="var(--company-muted)">محصول و توانمندی</text></g>
      <g class="card card-4" transform="translate(540 110)"><rect x="-55" y="-35" width="110" height="70" rx="17" fill="url(#panel)" stroke="var(--company-primary)" stroke-opacity=".75"/><g fill="none" stroke="var(--company-primary)" stroke-width="2"><path d="M-18 12-7 2l8 5 17-22" class="chart"/><path d="M10-15h8v8"/></g><text y="27" fill="var(--company-muted)">رشد کسب‌وکار</text></g>
      <g class="card card-5" transform="translate(550 433)"><rect x="-55" y="-35" width="110" height="70" rx="17" fill="url(#panel)" stroke="var(--company-accent)" stroke-opacity=".7"/><g fill="none" stroke="var(--company-accent)" stroke-width="1.7"><path d="M-20 11c2-10 8-15 17-15S12 1 14 11M-3-7a9 9 0 1 0 0-18 9 9 0 0 0 0 18M9-11l5 5 10-12"/></g><text y="28" fill="var(--company-muted)">اعتماد مشتریان</text></g>
    </g>

    <g class="particles" fill="var(--company-primary)">
      <circle r="3"><animateMotion dur="3.8s" repeatCount="indefinite"><mpath href="#teamPath"/></animateMotion></circle>
      <circle r="3"><animateMotion dur="4.2s" begin="-1.4s" repeatCount="indefinite"><mpath href="#servicePath"/></animateMotion></circle>
      <circle r="3"><animateMotion dur="4s" begin="-2.3s" repeatCount="indefinite"><mpath href="#productPath"/></animateMotion></circle>
      <circle r="3"><animateMotion dur="3.9s" begin="-.8s" repeatCount="indefinite"><mpath href="#growthPath"/></animateMotion></circle>
      <circle r="3"><animateMotion dur="4.1s" begin="-2.9s" repeatCount="indefinite"><mpath href="#customerPath"/></animateMotion></circle>
    </g>
  </g>

  <g class="copy" direction="rtl" text-anchor="end" font-family="Tahoma,Arial,sans-serif">
    <rect x="682" y="168" width="4" height="101" rx="2" fill="var(--company-primary)"/>
    <text x="900" y="208" fill="var(--company-ink)" font-size="29" font-weight="700">معرفی حرفه‌ای شرکت ایرانی</text>
    <text x="900" y="247" fill="var(--company-muted)" font-size="15">خدمات، توانمندی‌ها و هویت حرفه‌ای کسب‌وکار شما</text>
    <g transform="translate(900 298)" fill="none" stroke="var(--company-accent)" stroke-width="1.5"><path d="M0 0h-142"/><circle cx="-142" r="3" fill="var(--company-accent)"/></g>
    <text x="900" y="335" fill="var(--company-muted)" font-size="13">تیم متخصص  •  راهکارهای قابل اعتماد  •  رشد پایدار</text>
  </g>
</svg>
