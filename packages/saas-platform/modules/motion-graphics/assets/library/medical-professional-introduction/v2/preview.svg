<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc" aria-label="معرفی حرفه‌ای پزشک"><title id="title">پیش‌نمایش معرفی حرفه‌ای پزشک</title><desc id="desc">روایت ارتباط امن و انسانی میان پزشک و بیمار با خدمات سلامت دیجیتال.</desc>
<style id="asset-theme">:root{--asset-primary:#42c7b5;--asset-secondary:#1b3554;--asset-accent:#e4b94f;--asset-background:#f3f7f7;--asset-border:#17304d;color:var(--asset-border);--asset-current:currentColor}</style><style>:root{--primary:var(--asset-primary);--accent:var(--asset-primary);--ink:var(--asset-background);--muted:var(--asset-primary);--surface:var(--asset-border);--soft:var(--asset-border);--speed:9s}.panel{fill:var(--surface);stroke:var(--accent);stroke-width:1.5}.soft{fill:var(--soft);stroke:var(--accent);stroke-width:1.3}.primary{fill:none;stroke:var(--primary);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.accent{fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round}.muted-line{fill:none;stroke:var(--muted);stroke-width:1.4;stroke-linecap:round}.label{fill:var(--muted);font:12px Tahoma,Arial,sans-serif;text-anchor:middle}.small{fill:var(--ink);font:12px Tahoma,Arial,sans-serif}.tiny{fill:var(--muted);font:10px Tahoma,Arial,sans-serif}.copy{animation:copy var(--speed) ease-in-out infinite}@keyframes copy{0%,8%,96%,100%{opacity:.65;transform:translateX(5px)}20%,86%{opacity:1;transform:none}}.portrait{fill:var(--surface);stroke:var(--accent);stroke-width:2}.doctor .primary,.patient .primary{fill:none;stroke:var(--primary);stroke-width:2}.coat{fill:none}.health-panel{animation:panelFloat var(--speed) ease-in-out infinite}.heartbeat{fill:none;stroke:var(--primary);stroke-width:2.5;stroke-dasharray:260;animation:heart 4s linear infinite}.secure-chat{animation:chat 3s ease-in-out infinite}.lock{fill:var(--surface);stroke:var(--accent)}.trust{fill:var(--soft);stroke:var(--accent);stroke-width:1.7;animation:trust 3s ease-in-out infinite}@keyframes panelFloat{0%,100%{transform:translateY(3px)}50%{transform:translateY(-4px)}}@keyframes heart{from{stroke-dashoffset:260}to{stroke-dashoffset:0}}@keyframes chat{50%{transform:translateX(6px)}}@keyframes trust{50%{opacity:.55;transform:scale(.93)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}.smil{display:none}}*{animation:none!important}.smil{display:none}</style><rect width="960" height="540" rx="28" fill="var(--asset-border)"/><g class="medical-scene">
<g class="doctor" transform="translate(125 275)"><circle class="portrait" r="72"/><circle class="primary" cy="-25" r="22"/><path class="primary" d="M-45 47c4-31 19-47 45-47s41 16 45 47M-24 12c0 25 48 25 48 0M0 12v25m-10-12h20"/><path class="accent coat" d="M-43 39-18 16 0 49l18-33 25 23"/><text class="label" y="100">پزشک</text></g>
<g class="health-panel" transform="translate(265 145)"><rect class="panel" width="230" height="245" rx="24"/><rect class="soft" x="22" y="22" width="186" height="65" rx="14"/><path class="heartbeat" d="M36 56h31l13-24 18 49 18-35 14 10h62"/><text class="small" x="22" y="112">پرونده سلامت دیجیتال</text><path class="muted-line" d="M22 128h186M22 153h118M22 178h156"/><g class="secure-chat"><rect class="soft" x="22" y="197" width="118" height="28" rx="9"/><path class="accent" d="M35 211h70"/><rect class="lock" x="164" y="196" width="28" height="28" rx="7"/><path class="accent" d="M171 196v-6a7 7 0 0 1 14 0v6M178 208v7"/></g><g class="smil"><circle r="4" fill="var(--primary)"><animateMotion dur="2.4s" repeatCount="indefinite" path="M36 56h31l13-24 18 49 18-35 14 10h62"/></circle></g></g>
<g class="patient" transform="translate(575 275)"><circle class="portrait" r="68"/><circle class="primary" cy="-22" r="21"/><path class="primary" d="M-42 45c4-29 18-44 42-44s38 15 42 44M-11-19h3m16 0h3M-10-10c7 7 13 7 20 0"/><path class="trust" d="M28-58c9 6 16 7 23 8v14c0 13-7 21-23 28-16-7-23-15-23-28v-14c7-1 14-2 23-8zM17-35l7 7 14-17"/><text class="label" y="96">بیمار</text></g></g><g class="copy" direction="rtl" text-anchor="end" font-family="Tahoma,Arial,sans-serif"><rect x="680" y="168" width="4" height="102" rx="2" fill="var(--primary)"/><text x="900" y="208" fill="var(--ink)" font-size="28" font-weight="700">معرفی حرفه‌ای پزشک</text><text x="900" y="247" fill="var(--muted)" font-size="15">تخصص پزشکی، ارتباط امن و اعتماد بیمار</text><path d="M900 298H752" fill="none" stroke="var(--accent)" stroke-width="1.5"/><text x="900" y="334" fill="var(--muted)" font-size="12">doctor portrait  •  patient portrait  •  heart waveform</text></g></svg>
