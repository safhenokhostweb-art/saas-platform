<g class="crane" transform="translate(350 85)"><path class="crane-line" d="M0 350V0h30v350M-30 350h90M15 25h230M15 25l105-25 105 25M90 25v35"/><rect class="trolley" x="82" y="20" width="18" height="12"/><path class="hook-line" d="M91 32v115"/><path class="hook" d="M91 147v16c0 17 23 17 23 0"/><text class="label" x="118" y="378">فرایند اجرا</text></g>
