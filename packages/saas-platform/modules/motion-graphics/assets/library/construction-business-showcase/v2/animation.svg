<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc" aria-label="نمایش خدمات ساخت‌وساز"><title id="title">نمایش خدمات ساخت‌وساز</title><desc id="desc">روایت شکل‌گیری پروژه از نقشه معماری و خطوط مهندسی تا بالا آمدن ساختمان.</desc>
<style id="asset-theme">:root{--asset-primary:#42c7b5;--asset-secondary:#1b3554;--asset-accent:#e4b94f;--asset-background:#f3f7f7;--asset-border:#17304d;color:var(--asset-border);--asset-current:currentColor}</style><style>:root{--primary:var(--asset-accent);--accent:var(--asset-primary);--ink:var(--asset-background);--muted:var(--asset-primary);--surface:var(--asset-border);--soft:var(--asset-border);--speed:9s}.panel{fill:var(--surface);stroke:var(--accent);stroke-width:1.5}.soft{fill:var(--soft);stroke:var(--accent);stroke-width:1.3}.primary{fill:none;stroke:var(--primary);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.accent{fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round}.muted-line{fill:none;stroke:var(--muted);stroke-width:1.4;stroke-linecap:round}.label{fill:var(--muted);font:12px Tahoma,Arial,sans-serif;text-anchor:middle}.small{fill:var(--ink);font:12px Tahoma,Arial,sans-serif}.tiny{fill:var(--muted);font:10px Tahoma,Arial,sans-serif}.copy{animation:copy var(--speed) ease-in-out infinite}@keyframes copy{0%,8%,96%,100%{opacity:.65;transform:translateX(5px)}20%,86%{opacity:1;transform:none}}.blueprint-sheet{fill:var(--surface);stroke:var(--accent);stroke-width:2}.grid{fill:none;stroke:var(--accent);stroke-width:.7}.architecture{fill:none;stroke:var(--primary);stroke-width:2;stroke-dasharray:800;animation:draw 8s ease-in-out infinite}.dimension{fill:none;stroke:var(--muted);stroke-width:1}.crane-line,.hook-line,.hook{fill:none;stroke:var(--primary);stroke-width:2}.trolley{fill:var(--primary);animation:trolley 5s ease-in-out infinite}.hook-line,.hook{animation:hook 4s ease-in-out infinite}.floor{fill:var(--soft);stroke:var(--accent);stroke-width:1.5;transform-box:fill-box;transform-origin:bottom;animation:rise var(--speed) ease-in-out infinite}.f2{animation-delay:-.5s}.f3{animation-delay:-1s}.f4{animation-delay:-1.5s}.f5{animation-delay:-2s}.building-outline,.windows{fill:none;stroke:var(--primary);stroke-width:2}.pin path{fill:var(--accent);stroke:var(--surface)}.pin circle{fill:var(--surface)}.pin{animation:pin 3s ease-in-out infinite}@keyframes draw{0%,12%,100%{stroke-dashoffset:800}45%,88%{stroke-dashoffset:0}}@keyframes trolley{50%{transform:translateX(95px)}}@keyframes hook{50%{transform:translateY(35px)}}@keyframes rise{0%,18%,100%{transform:scaleY(.08);opacity:.35}42%,88%{transform:scaleY(1);opacity:1}}@keyframes pin{50%{transform:translateY(-7px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}.smil{display:none}}</style><g class="construction-scene">
