<svg xmlns="http://www.w3.org/2000/svg" direction="rtl" viewBox="0 0 960 540" role="img" aria-labelledby="title desc" aria-label="موشن نیروگاه خورشیدی — تولید، ذخیره و مصرف انرژی پاک"><title id="title">موشن نیروگاه خورشیدی</title><desc id="desc">تابش خورشید روی آرایه پنل‌ها، جریان انرژی از اینورتر به باتری و ساختمان، و کارت‌های تولید امروز، صرفه‌جویی و کاهش کربن؛ چیدمان راست‌به‌چپ.</desc>
<style id="asset-theme">:root{--asset-primary:#1d4ed8;--asset-secondary:#0891b2;--asset-accent:#f59e0b;--asset-background:#f3f7fb;--asset-border:#d8e2ef;--asset-surface:#ffffff;--asset-ink:#0f172a;--asset-muted:#5b6b82;--asset-success:#16a34a}@media (prefers-color-scheme:dark){:root{--asset-primary:#60a5fa;--asset-secondary:#22d3ee;--asset-accent:#fbbf24;--asset-background:#0a1220;--asset-border:#22324c;--asset-surface:#111c30;--asset-ink:#e6edf7;--asset-muted:#8fa1bd;--asset-success:#4ade80}}</style>
<style>
.bg{fill:var(--asset-background)}.dot{fill:var(--asset-border)}
.s-a{stop-color:var(--asset-accent)}.s-p{stop-color:var(--asset-primary)}.s-s{stop-color:var(--asset-secondary)}.s-w{stop-color:var(--asset-surface)}
.surface{fill:var(--asset-surface);stroke:var(--asset-border);stroke-width:1.2}
.soft{fill:var(--asset-background)}.shadow{fill:var(--asset-ink);opacity:.07}
.sun{fill:var(--asset-accent)}.ray{fill:none;stroke:var(--asset-accent);stroke-width:3;stroke-linecap:round}
.beam{fill:none;stroke:var(--asset-accent);stroke-width:1.6;stroke-dasharray:3 9;opacity:.55}
.panel{fill:var(--asset-primary)}.cell{fill:none;stroke:var(--asset-surface);stroke-width:1;opacity:.45}.leg{fill:none;stroke:var(--asset-muted);stroke-width:3;stroke-linecap:round}
.wire{fill:none;stroke:var(--asset-border);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.flow{fill:none;stroke:var(--asset-success);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:6 12}
.flow-a{stroke:var(--asset-accent)}
.pri{fill:var(--asset-primary)}.sec{fill:var(--asset-secondary)}.acc{fill:var(--asset-accent)}.ok{fill:var(--asset-success)}
.tint{fill:var(--asset-primary);opacity:.12}.tint-ok{fill:var(--asset-success);opacity:.14}.tint-acc{fill:var(--asset-accent);opacity:.18}.tint-sec{fill:var(--asset-secondary);opacity:.14}
.stroke-ok{fill:none;stroke:var(--asset-success);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.stroke-ink{fill:none;stroke:var(--asset-muted);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.roof{fill:var(--asset-secondary)}.win-l{fill:var(--asset-accent)}
.t{direction:rtl;font-family:'Vazirmatn',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;fill:var(--asset-ink)}
.h{font-size:15px;font-weight:800}.l{font-size:11px;fill:var(--asset-muted)}.v{font-size:17px;font-weight:800}.c{font-size:12px;font-weight:700}.w{fill:var(--asset-surface)}
.g{transform-box:fill-box;transform-origin:center}
.card{animation:rise calc(.9s*var(--k,1)) cubic-bezier(.2,.8,.2,1) both}
.pop{animation:pop calc(.6s*var(--k,1)) cubic-bezier(.2,.9,.3,1.2) both}.p1{animation-delay:calc(.35s*var(--k,1))}.p2{animation-delay:calc(.5s*var(--k,1))}.p3{animation-delay:calc(.65s*var(--k,1))}
.in-r{animation:inR calc(.8s*var(--k,1)) cubic-bezier(.2,.8,.2,1) both}.in-l{animation:inL calc(.8s*var(--k,1)) cubic-bezier(.2,.8,.2,1) both}
.d1{animation-delay:calc(.9s*var(--k,1))}.d2{animation-delay:calc(1.1s*var(--k,1))}.d3{animation-delay:calc(1.3s*var(--k,1))}.d4{animation-delay:calc(1.5s*var(--k,1))}
.rays{transform-box:view-box;transform-origin:812px 112px;animation:spin calc(40s*var(--k,1)) linear infinite}
.glow{transform-box:fill-box;transform-origin:center;animation:breathe calc(6s*var(--k,1)) ease-in-out infinite}
.beam{animation:beam calc(1.8s*var(--k,1)) linear infinite}
.flow{animation:flow calc(1.4s*var(--k,1)) linear infinite}.fl2{animation-delay:calc(-.5s*var(--k,1))}.fl3{animation-delay:calc(-.9s*var(--k,1))}
.shine{animation:shine calc(4.5s*var(--k,1)) calc(1.2s*var(--k,1)) ease-in-out infinite;opacity:0}
.charge{transform-box:fill-box;transform-origin:right center;animation:charge calc(2.4s*var(--k,1)) calc(1.4s*var(--k,1)) cubic-bezier(.4,0,.2,1) both}
.live{transform-box:fill-box;transform-origin:center;animation:pulse calc(2.2s*var(--k,1)) ease-out infinite}
.lit{animation:blink calc(3.6s*var(--k,1)) calc(1.8s*var(--k,1)) ease-in-out infinite}
.float{animation:float calc(6s*var(--k,1)) ease-in-out infinite}.f2{animation-duration:calc(7s*var(--k,1));animation-delay:calc(-2s*var(--k,1))}
.draw{stroke-dasharray:100;animation:draw calc(1.4s*var(--k,1)) calc(1s*var(--k,1)) cubic-bezier(.4,0,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.86)}to{opacity:1;transform:none}}
@keyframes inR{from{opacity:0;transform:translateX(36px)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-36px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{0%,100%{opacity:.6;transform:scale(1)}50%{opacity:.95;transform:scale(1.08)}}
@keyframes beam{to{stroke-dashoffset:-24}}
@keyframes flow{to{stroke-dashoffset:-36}}
@keyframes shine{0%{opacity:0;transform:translateX(0)}20%{opacity:.55}60%{opacity:.55}100%{opacity:0;transform:translateX(-210px)}}
@keyframes charge{from{transform:scaleX(.18)}to{transform:none}}
@keyframes pulse{0%{opacity:.75;transform:scale(1)}100%{opacity:0;transform:scale(3)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes draw{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<pattern id="sm-dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle class="dot" cx="2" cy="2" r="1.2"/></pattern>
<radialGradient id="sm-sun-glow"><stop offset="0" class="s-a" stop-opacity=".45"/><stop offset="1" class="s-a" stop-opacity="0"/></radialGradient>
<radialGradient id="sm-glow-b"><stop offset="0" class="s-s" stop-opacity=".22"/><stop offset="1" class="s-s" stop-opacity="0"/></radialGradient>
<linearGradient id="sm-shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" class="s-w" stop-opacity="0"/><stop offset=".5" class="s-w" stop-opacity=".7"/><stop offset="1" class="s-w" stop-opacity="0"/></linearGradient>
<linearGradient id="sm-cta" x1="1" y1="0" x2="0" y2="1"><stop offset="0" class="s-p"/><stop offset="1" class="s-s"/></linearGradient>
<clipPath id="sm-array"><path d="M574 214h224l-26 74H548z"/></clipPath>
</defs>
<rect class="bg" width="960" height="540"/>
<rect fill="url(#sm-dots)" width="960" height="540" opacity=".6"/>
