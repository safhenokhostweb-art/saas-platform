<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc" aria-label="دستیار هوشمند کسب‌وکار"><title id="title">پیش‌نمایش دستیار هوشمند کسب‌وکار</title><desc id="desc">دستیار هوشمند داده‌ها را تحلیل می‌کند، پیشنهاد می‌دهد و وظایف کسب‌وکار را خودکار پیش می‌برد.</desc>
<style id="asset-theme">:root{--asset-primary:#42c7b5;--asset-secondary:#1b3554;--asset-accent:#e4b94f;--asset-background:#f3f7f7;--asset-border:#17304d;color:var(--asset-border);--asset-current:currentColor}</style><style>:root{--primary:var(--asset-secondary);--accent:var(--asset-primary);--ink:var(--asset-background);--muted:var(--asset-primary);--surface:var(--asset-border);--soft:var(--asset-border);--speed:9s}.panel{fill:var(--surface);stroke:var(--accent);stroke-width:1.5}.soft{fill:var(--soft);stroke:var(--accent);stroke-width:1.4}.primary{fill:none;stroke:var(--primary);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.accent{fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.muted-line{fill:none;stroke:var(--muted);stroke-width:1.4;stroke-linecap:round}.label{fill:var(--muted);font:12px Tahoma,Arial,sans-serif;text-anchor:middle}.small{fill:var(--ink);font:12px Tahoma,Arial,sans-serif}.tiny{fill:var(--muted);font:10px Tahoma,Arial,sans-serif}.copy{animation:copy var(--speed) ease-in-out infinite}@keyframes copy{0%,8%,96%,100%{opacity:.65;transform:translateX(5px)}20%,86%{opacity:1;transform:none}}.brain-shell{fill:var(--surface);stroke:var(--primary);stroke-width:2}.brain{fill:none;stroke:var(--primary);stroke-width:2;stroke-linecap:round}.pulse-core{fill:var(--primary);animation:pulse 2.4s ease-in-out infinite}.workspace-panel{animation:workspace var(--speed) ease-in-out infinite}.bars rect{fill:var(--accent);opacity:.55;transform-box:fill-box;transform-origin:bottom}.b1{animation:bar 2.4s -.4s ease-in-out infinite}.b2{animation:bar 2.7s -1s ease-in-out infinite}.b3{animation:bar 2.2s -1.5s ease-in-out infinite}.b4{animation:bar 2.9s -.8s ease-in-out infinite}.analysis-line{stroke-dasharray:220;animation:draw var(--speed) ease-in-out infinite}.recommend{animation:recommend 3.5s ease-in-out infinite}.check{fill:var(--surface);stroke:var(--accent)}.scan{fill:var(--accent);opacity:.25}@keyframes pulse{50%{opacity:.45;transform:scale(.82)}}@keyframes workspace{0%,100%{transform:translateY(3px)}50%{transform:translateY(-4px)}}@keyframes bar{50%{transform:scaleY(.68)}}@keyframes draw{0%,15%,100%{stroke-dashoffset:220}40%,85%{stroke-dashoffset:0}}@keyframes recommend{0%,100%{transform:translateX(0)}50%{transform:translateX(8px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}.smil{display:none}}*{animation:none!important}.smil{display:none}</style><rect width="960" height="540" rx="28" fill="var(--asset-border)"/><g class="ai-workspace">
<g transform="translate(175 270)"><circle class="brain-shell" r="92"/><path class="brain" d="M0-54c-23-18-49 2-42 25-24 8-23 42 0 50-3 28 31 42 48 21 19 15 47-2 40-25 24-13 18-47-8-52 2-25-26-41-38-19zM0-48v92M-34-23c17 1 23 11 22 25M-36 24c15-9 28-7 36 5M34-24c-17 1-23 11-22 25M36 23c-15-9-28-7-36 5"/><circle class="pulse-core" r="13"/><text class="label" y="125">هسته تحلیل AI</text></g>
<g class="workspace-panel" transform="translate(405 125)"><rect class="panel" width="205" height="250" rx="22"/><path class="muted-line" d="M24 45h157M24 190h157"/><g class="bars"><rect class="bar b1" x="28" y="115" width="22" height="52" rx="4"/><rect class="bar b2" x="62" y="91" width="22" height="76" rx="4"/><rect class="bar b3" x="96" y="126" width="22" height="41" rx="4"/><rect class="bar b4" x="130" y="69" width="22" height="98" rx="4"/></g><path class="primary analysis-line" d="M28 105 74 77l42 25 57-54"/><text class="small" x="24" y="30">تحلیل عملکرد</text>
<g class="recommend"><rect class="soft" x="22" y="204" width="102" height="28" rx="8"/><path class="accent" d="m34 219 7 7 12-15"/><text class="tiny" x="63" y="222">پیشنهاد هوشمند</text></g>
<g class="tasks"><circle class="check" cx="157" cy="212" r="12"/><path class="accent" d="m151 212 5 5 9-11"/></g><rect class="scan" x="20" y="51" width="165" height="2" rx="1"/></g>
<g class="smil"><rect x="425" y="176" width="165" height="2" fill="var(--accent)" opacity=".8"><animate attributeName="y" values="176;305;176" dur="3s" repeatCount="indefinite"/></rect></g></g><g class="copy" direction="rtl" text-anchor="end" font-family="Tahoma,Arial,sans-serif"><rect x="680" y="168" width="4" height="102" rx="2" fill="var(--primary)"/><text x="900" y="208" fill="var(--ink)" font-size="28" font-weight="700">دستیار هوشمند کسب‌وکار</text><text x="900" y="247" fill="var(--muted)" font-size="15">تحلیل، پیشنهاد و اجرای هوشمند تصمیم‌ها</text><path d="M900 298H752" fill="none" stroke="var(--accent)" stroke-width="1.5"/><circle cx="752" cy="298" r="3" fill="var(--accent)"/><text x="900" y="334" fill="var(--muted)" font-size="12">AI brain core  •  analysis dashboard  •  recommendation card</text></g></svg>
