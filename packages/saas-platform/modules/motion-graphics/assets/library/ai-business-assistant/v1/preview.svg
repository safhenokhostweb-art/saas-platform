<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc" aria-label="دستیار هوشمند کسب‌وکار"><title id="title">پیش‌نمایش دستیار هوشمند کسب‌وکار</title><desc id="desc">نمایش هسته هوش مصنوعی که داشبورد، اتوماسیون، پیشنهادهای هوشمند و سرویس‌های کسب‌وکار را هماهنگ می‌کند.</desc>
