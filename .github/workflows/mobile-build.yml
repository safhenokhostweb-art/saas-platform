name: Mobile Client Build — Phase M2.1

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-build.yml'
      - 'packages/saas-platform/core-utils/src/MobileRuntime/**'
  pull_request:
    paths:
      - 'mobile/**'
      - 'packages/saas-platform/core-utils/src/MobileRuntime/**'
  workflow_dispatch:
    inputs:
      build_android:
        description: 'Build Android'
        type: boolean
        default: true
      build_windows:
        description: 'Build Windows'
        type: boolean
        default: true
      build_linux:
        description: 'Build Linux'
        type: boolean
        default: true
      build_ios:
        description: 'Build iOS IPA (requires signing secrets)'
        type: boolean
        default: false
      skip_governance:
        description: 'Skip governance check (emergency only)'
        type: boolean
        default: false

concurrency:
  group: mobile-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.22.3'
  GOVERNANCE_THRESHOLD: 95

# ─── Job 1: Analysis & Tests ──────────────────────────────────────────────────
jobs:
  analyze:
    name: 'Analyze & Test'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run analysis
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test --coverage

      - name: Check formatting
        run: dart format --set-exit-if-changed lib/

# ─── Job 2: Production Client Governance Gate ────────────────────────────────

  governance:
    name: 'Production Client Governance (≥95/100 required)'
    runs-on: ubuntu-latest
    needs: analyze
    if: github.event.inputs.skip_governance != 'true'
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, redis, sqlite3
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Validate client runtime (M1.0 baseline)
        run: php artisan mobile:validate-client-runtime --json
        env:
          APP_ENV: testing
          APP_KEY: base64:dGVzdF9rZXlfZm9yX2NpX3BsYWNlaG9sZGVyX18=

      - name: Validate client security (M1.0 baseline)
        run: php artisan mobile:validate-client-security --json
        env:
          APP_ENV: testing
          APP_KEY: base64:dGVzdF9rZXlfZm9yX2NpX3BsYWNlaG9sZGVyX18=

      - name: Validate client governance (M1.0 baseline)
        run: php artisan mobile:validate-client-governance --json
        env:
          APP_ENV: testing
          APP_KEY: base64:dGVzdF9rZXlfZm9yX2NpX3BsYWNlaG9sZGVyX18=

      - name: ⚡ Validate production client M2.1 (REQUIRED — score ≥ 95)
        id: production_governance
        run: |
          RESULT=$(php artisan mobile:validate-production-client --json \
            APP_ENV=testing \
            APP_KEY=base64:dGVzdF9rZXlfZm9yX2NpX3BsYWNlaG9sZGVyX18=)
          echo "$RESULT"
          SCORE=$(echo "$RESULT" | python3 -c "import sys,json; print(json.load(sys.stdin)['score'])")
          echo "production_score=$SCORE" >> $GITHUB_OUTPUT
          if [ "$SCORE" -lt "$GOVERNANCE_THRESHOLD" ]; then
            echo "::error::Production client governance FAILED — score $SCORE < $GOVERNANCE_THRESHOLD"
            exit 1
          fi
          echo "::notice::Production client governance PASSED — score $SCORE / 100"
        env:
          APP_ENV: testing
          APP_KEY: base64:dGVzdF9rZXlfZm9yX2NpX3BsYWNlaG9sZGVyX18=

      - name: Post governance score as PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const score = '${{ steps.production_governance.outputs.production_score }}';
            const pass  = parseInt(score) >= parseInt('${{ env.GOVERNANCE_THRESHOLD }}');
            const icon  = pass ? '✅' : '❌';
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner:        context.repo.owner,
              repo:         context.repo.repo,
              body:         `## ${icon} M2.1 Production Client Governance\n\n` +
                            `**Score:** ${score} / 100  \n` +
                            `**Threshold:** ${{ env.GOVERNANCE_THRESHOLD }} / 100  \n` +
                            `**Result:** ${pass ? 'PASS' : 'FAIL'}`,
            });

# ─── Job 3: Android (APK + AAB) ──────────────────────────────────────────────

  build-android:
    name: 'Build Android (APK + AAB)'
    runs-on: ubuntu-latest
    needs: [analyze, governance]
    if: github.event.inputs.build_android != 'false'
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (release, split by ABI)
        run: flutter build apk --release --split-per-abi

      - name: Build AAB (release)
        run: flutter build appbundle --release

      - name: Compute APK checksums
        run: |
          for f in build/app/outputs/flutter-apk/*.apk; do
            sha256sum "$f" >> build/app/outputs/flutter-apk/checksums.sha256
          done

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: |
            mobile/build/app/outputs/flutter-apk/*.apk
            mobile/build/app/outputs/flutter-apk/checksums.sha256
          retention-days: 30

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: mobile/build/app/outputs/bundle/release/*.aab
          retention-days: 30

# ─── Job 4: Windows EXE ───────────────────────────────────────────────────────

  build-windows:
    name: 'Build Windows EXE'
    runs-on: windows-latest
    needs: [analyze, governance]
    if: github.event.inputs.build_windows != 'false'
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Package installer archive + checksum
        run: |
          Compress-Archive -Path "build\windows\x64\runner\Release\*" `
            -DestinationPath "build\saas-client-windows.zip"
          $hash = (Get-FileHash "build\saas-client-windows.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  saas-client-windows.zip" | Out-File -FilePath "build\saas-client-windows.zip.sha256" -Encoding utf8

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: |
            mobile/build/saas-client-windows.zip
            mobile/build/saas-client-windows.zip.sha256
          retention-days: 30

# ─── Job 5: Linux AppImage ────────────────────────────────────────────────────

  build-linux:
    name: 'Build Linux'
    runs-on: ubuntu-latest
    needs: [analyze, governance]
    if: github.event.inputs.build_linux != 'false'
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev libblkid-dev liblzma-dev \
            libsecret-1-dev libjsoncpp-dev libayatana-appindicator3-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux release
        run: flutter build linux --release

      - name: Package as tar.gz + checksum
        run: |
          cd build/linux/x64/release
          tar -czf ../../../../saas-client-linux.tar.gz bundle/
          cd ../../../..
          sha256sum saas-client-linux.tar.gz > saas-client-linux.tar.gz.sha256

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: |
            mobile/saas-client-linux.tar.gz
            mobile/saas-client-linux.tar.gz.sha256
          retention-days: 30

# ─── Job 6: iOS IPA (main branch + manual trigger with signing secrets) ──────

  build-ios:
    name: 'Build iOS IPA'
    runs-on: macos-latest
    needs: [analyze, governance]
    if: |
      (github.ref == 'refs/heads/main' || github.event.inputs.build_ios == 'true') &&
      secrets.IOS_SIGNING_CERTIFICATE_P12_BASE64 != ''
    defaults:
      run:
        working-directory: mobile
    env:
      IOS_BUNDLE_ID:         ${{ secrets.IOS_BUNDLE_ID }}
      IOS_TEAM_ID:           ${{ secrets.IOS_TEAM_ID }}
      KEYCHAIN_PASSWORD:     ${{ secrets.KEYCHAIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # ── Signing setup ─────────────────────────────────────────────────────
      - name: Create temporary keychain
        run: |
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain

      - name: Import P12 certificate
        env:
          P12_BASE64:   ${{ secrets.IOS_SIGNING_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          echo "$P12_BASE64" | base64 --decode > certificate.p12
          security import certificate.p12 \
            -k build.keychain \
            -P "$P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/productbuild
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm -f certificate.p12

      - name: Install provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/build_profile.mobileprovision

      # ── Build ──────────────────────────────────────────────────────────────
      - name: Build IPA
        run: |
          flutter build ipa --release \
            --dart-define=BUNDLE_ID=${IOS_BUNDLE_ID:-com.yourcompany.saasPlatformClient}

      - name: Compute IPA checksum
        run: |
          IPA=$(find build/ios/ipa -name "*.ipa" | head -1)
          shasum -a 256 "$IPA" > "${IPA}.sha256"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: |
            mobile/build/ios/ipa/*.ipa
            mobile/build/ios/ipa/*.sha256
          retention-days: 30

      # ── App Store Connect upload (main branch only) ───────────────────────
      - name: Upload to App Store Connect
        if: github.ref == 'refs/heads/main' && secrets.APP_STORE_CONNECT_API_KEY_ID != ''
        env:
          API_KEY_ID:     ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ISSUER_ID:      ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$API_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8
          IPA=$(find build/ios/ipa -name "*.ipa" | head -1)
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA" \
            --apiKey   "$API_KEY_ID" \
            --apiIssuer "$ISSUER_ID"

      # ── Cleanup ────────────────────────────────────────────────────────────
      - name: Remove keychain
        if: always()
        run: security delete-keychain build.keychain || true

# ─── Job 7: macOS (main branch only) ─────────────────────────────────────────

  build-macos:
    name: 'Build macOS'
    runs-on: macos-latest
    needs: [analyze, governance]
    if: github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS release
        run: flutter build macos --release

      - name: Package
        run: |
          cd build/macos/Build/Products/Release
          zip -r ../../../../saas-client-macos.zip "saas_platform_client.app"
          cd ../../../..
          sha256sum saas-client-macos.zip > saas-client-macos.zip.sha256

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: |
            mobile/saas-client-macos.zip
            mobile/saas-client-macos.zip.sha256
          retention-days: 30

# ─── Job 7: Build summary ─────────────────────────────────────────────────────

  summary:
    name: 'Build Summary'
    runs-on: ubuntu-latest
    needs: [build-android, build-windows, build-ios]
    if: always()
    steps:
      - name: Report build results
        uses: actions/github-script@v7
        with:
          script: |
            const android = '${{ needs.build-android.result }}';
            const windows = '${{ needs.build-windows.result }}';
            const ios     = '${{ needs.build-ios.result }}';
            const gov     = '${{ needs.governance.result }}';

            const required = [android, windows, gov];
            const allOk = required.every(r => r === 'success' || r === 'skipped');
            const icon  = allOk ? '✅' : '⚠️';

            console.log(`${icon} Build Summary`);
            console.log(`  Android:    ${android}`);
            console.log(`  Windows:    ${windows}`);
            console.log(`  iOS:        ${ios}`);
            console.log(`  Governance: ${gov}`);

            if (!allOk) {
              core.setFailed('One or more required build jobs failed.');
            }
