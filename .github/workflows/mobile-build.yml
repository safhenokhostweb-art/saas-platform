name: Mobile Client Build — Phase M2.0

on:
  push:
    branches: [main, develop]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-build.yml'
  pull_request:
    paths:
      - 'mobile/**'
  workflow_dispatch:
    inputs:
      build_android:
        description: 'Build Android'
        type: boolean
        default: true
      build_windows:
        description: 'Build Windows'
        type: boolean
        default: true
      build_linux:
        description: 'Build Linux'
        type: boolean
        default: true

env:
  FLUTTER_VERSION: '3.22.3'

# ─── Job 1: Analysis & Tests ──────────────────────────────────────────────────
jobs:
  analyze:
    name: 'Analyze & Test'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run analysis
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test --coverage

      - name: Check formatting
        run: dart format --set-exit-if-changed lib/

# ─── Job 2: Android (APK + AAB) ──────────────────────────────────────────────

  build-android:
    name: 'Build Android'
    runs-on: ubuntu-latest
    needs: analyze
    if: github.event.inputs.build_android != 'false'
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (release)
        run: flutter build apk --release --split-per-abi

      - name: Build AAB (release)
        run: flutter build appbundle --release

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: mobile/build/app/outputs/flutter-apk/*.apk
          retention-days: 30

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: mobile/build/app/outputs/bundle/release/*.aab
          retention-days: 30

# ─── Job 3: Windows EXE ───────────────────────────────────────────────────────

  build-windows:
    name: 'Build Windows'
    runs-on: windows-latest
    needs: analyze
    if: github.event.inputs.build_windows != 'false'
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Package installer
        run: |
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "build\saas-client-windows.zip"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: mobile/build/saas-client-windows.zip
          retention-days: 30

# ─── Job 4: Linux AppImage ────────────────────────────────────────────────────

  build-linux:
    name: 'Build Linux'
    runs-on: ubuntu-latest
    needs: analyze
    if: github.event.inputs.build_linux != 'false'
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev libblkid-dev liblzma-dev \
            libsecret-1-dev libjsoncpp-dev libayatana-appindicator3-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux release
        run: flutter build linux --release

      - name: Package as tar.gz
        run: |
          cd build/linux/x64/release
          tar -czf ../../../../saas-client-linux.tar.gz bundle/

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: mobile/saas-client-linux.tar.gz
          retention-days: 30

# ─── Job 5: macOS (self-hosted or macOS runner) ───────────────────────────────

  build-macos:
    name: 'Build macOS'
    runs-on: macos-latest
    needs: analyze
    if: github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS release
        run: flutter build macos --release

      - name: Package
        run: |
          cd build/macos/Build/Products/Release
          zip -r ../../../../saas-client-macos.zip "saas_platform_client.app"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: mobile/saas-client-macos.zip
          retention-days: 30

# ─── Job 6: Governance validation ─────────────────────────────────────────────

  governance:
    name: 'Client Governance Validation'
    runs-on: ubuntu-latest
    needs: analyze
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, redis, sqlite3

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Validate client runtime
        run: php artisan mobile:validate-client-runtime --json
        env:
          APP_ENV: testing
          APP_KEY: base64:test_key_for_ci_placeholder_32chars==

      - name: Validate client security
        run: php artisan mobile:validate-client-security --json

      - name: Validate client governance
        run: php artisan mobile:validate-client-governance --json
