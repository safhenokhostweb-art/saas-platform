name: Frontend Governance Enforcement

on:
  push:
    branches: [main, develop]
    paths:
      - 'packages/saas-platform/**/*.blade.php'
      - 'resources/views/**/*.blade.php'
      - 'resources/css/**'
      - 'packages/saas-platform/core-utils/resources/css/**'
      - 'package.json'
      - 'vite.config.js'
  pull_request:
    branches: [main, develop]
    paths:
      - 'packages/saas-platform/**/*.blade.php'
      - 'resources/views/**/*.blade.php'
      - 'resources/css/**'
      - 'packages/saas-platform/core-utils/resources/css/**'
      - 'package.json'
      - 'vite.config.js'

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1 — Component Authority: no raw controls, no inline styles, no hardcoded colors
  # ─────────────────────────────────────────────────────────────────────────────
  component-authority:
    name: Component Authority
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, pdo_sqlite

      - name: Cache Composer packages
        uses: actions/cache@v3
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-php-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy environment
        run: cp .env.example .env && php artisan key:generate

      - name: Validate Component Authority
        run: |
          php artisan frontend:validate-component-authority \
            --strict \
            --fail-on-drift \
            --json > /tmp/component-authority.json 2>&1
          EXITCODE=$?
          cat /tmp/component-authority.json
          exit $EXITCODE
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'

      - name: Upload component authority report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: component-authority-report
          path: /tmp/component-authority.json

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2 — Responsive Governance
  # ─────────────────────────────────────────────────────────────────────────────
  responsive-governance:
    name: Responsive Governance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, pdo_sqlite

      - name: Cache Composer packages
        uses: actions/cache@v3
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-php-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy environment
        run: cp .env.example .env && php artisan key:generate

      - name: Validate Responsive Governance
        run: |
          php artisan frontend:validate-responsive-governance \
            --strict \
            --json > /tmp/responsive-governance.json 2>&1
          EXITCODE=$?
          cat /tmp/responsive-governance.json
          exit $EXITCODE
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'

      - name: Upload responsive report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: responsive-governance-report
          path: /tmp/responsive-governance.json

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 3 — Enterprise Governance (master score must be >= 95)
  # ─────────────────────────────────────────────────────────────────────────────
  enterprise-governance:
    name: Enterprise Frontend Governance (≥95)
    runs-on: ubuntu-latest
    needs: [component-authority]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, pdo_sqlite

      - name: Cache Composer packages
        uses: actions/cache@v3
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-php-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy environment
        run: cp .env.example .env && php artisan key:generate

      - name: Validate Enterprise Governance
        run: |
          php artisan frontend:validate-enterprise-governance \
            --fail-below=95 \
            --json > /tmp/enterprise-governance.json 2>&1
          EXITCODE=$?
          cat /tmp/enterprise-governance.json
          exit $EXITCODE
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'

      - name: Upload enterprise governance report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: enterprise-governance-report
          path: /tmp/enterprise-governance.json

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 4 — Frontend Parity (zero drift)
  # ─────────────────────────────────────────────────────────────────────────────
  frontend-parity:
    name: Frontend Parity (Zero Drift)
    runs-on: ubuntu-latest
    needs: [enterprise-governance]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, pdo_sqlite

      - name: Cache Composer packages
        uses: actions/cache@v3
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-php-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy environment
        run: cp .env.example .env && php artisan key:generate

      - name: Validate Frontend Parity
        run: |
          php artisan frontend:validate-parity \
            --strict \
            --fail-on-drift \
            --fail-below=95 \
            --json > /tmp/frontend-parity.json 2>&1
          EXITCODE=$?
          cat /tmp/frontend-parity.json
          exit $EXITCODE
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'

      - name: Auto-heal check (dry run)
        run: |
          php artisan frontend:auto-heal --dry-run --cross-project --json > /tmp/auto-heal.json 2>&1
          cat /tmp/auto-heal.json
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'

      - name: Cross-repository governance check
        run: |
          php artisan frontend:validate-cross-repository-governance \
            --json > /tmp/cross-repo-governance.json 2>&1
          cat /tmp/cross-repo-governance.json
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'

      - name: Drift lockdown report
        run: |
          php artisan frontend:lockdown-report \
            --json > /tmp/lockdown-report.json 2>&1
          EXITCODE=$?
          cat /tmp/lockdown-report.json
          exit $EXITCODE
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'

      - name: Upload parity report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: frontend-parity-report
          path: |
            /tmp/frontend-parity.json
            /tmp/auto-heal.json
            /tmp/cross-repo-governance.json
            /tmp/lockdown-report.json

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 5 — Raw Control Static Analysis (fast, no Laravel boot required)
  # Blocks PRs instantly without full setup
  # ─────────────────────────────────────────────────────────────────────────────
  static-blade-analysis:
    name: Static Blade Analysis (fast)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for forbidden raw controls in changed Blade files
        run: |
          CHANGED=$(git diff --name-only origin/main...HEAD -- '*.blade.php' 2>/dev/null || git diff --name-only HEAD~1 HEAD -- '*.blade.php' 2>/dev/null || echo "")

          if [ -z "$CHANGED" ]; then
            echo "No Blade files changed — skipping static analysis"
            exit 0
          fi

          VIOLATIONS=0
          for f in $CHANGED; do
            if [ ! -f "$f" ]; then continue; fi

            # Skip core-ui component definitions (they define the controls)
            if echo "$f" | grep -q "core-utils/resources/views/components/"; then continue; fi
            # Skip Alpine template blocks (legitimate exception — JS-rendered)
            if grep -q "<template x-for" "$f"; then
              echo "⚠  $f — contains Alpine x-for template (exception granted for client-side controls)"
              continue
            fi

            for TAG in button input select textarea; do
              LINES=$(grep -n "<${TAG}[\s>\/]" "$f" 2>/dev/null || true)
              if [ -n "$LINES" ]; then
                echo "✗ Raw <${TAG}> in $f:"
                echo "$LINES" | head -5
                VIOLATIONS=$((VIOLATIONS + 1))
              fi
            done
          done

          if [ "$VIOLATIONS" -gt 0 ]; then
            echo ""
            echo "❌ $VIOLATIONS raw control violation(s) detected."
            echo "   Replace with x-core-ui::button / x-core-ui::input / x-core-ui::select / x-core-ui::textarea"
            exit 1
          fi

          echo "✓ All changed Blade files pass raw-control check."

      - name: Check for hardcoded hex colors in changed files
        run: |
          CHANGED=$(git diff --name-only origin/main...HEAD -- '*.blade.php' 2>/dev/null || git diff --name-only HEAD~1 HEAD -- '*.blade.php' 2>/dev/null || echo "")

          if [ -z "$CHANGED" ]; then exit 0; fi

          VIOLATIONS=0
          for f in $CHANGED; do
            if [ ! -f "$f" ]; then continue; fi
            if grep -nP 'style\s*=\s*["\'][^"\']*#[0-9a-fA-F]{3,8}' "$f" 2>/dev/null | grep -q .; then
              echo "✗ Hardcoded hex in inline style in $f"
              grep -nP 'style\s*=\s*["\'][^"\']*#[0-9a-fA-F]{3,8}' "$f" | head -3
              VIOLATIONS=$((VIOLATIONS + 1))
            fi
          done

          if [ "$VIOLATIONS" -gt 0 ]; then
            echo ""
            echo "❌ Hardcoded color violations detected. Use var(--ui-*) CSS tokens."
            exit 1
          fi

          echo "✓ No hardcoded colors in changed Blade files."

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 6 — Phase 10.2.8: Tailwind v4 Directive Enforcement (fast, no boot)
  # Blocks PRs that introduce legacy @tailwind v3 directives or tailwind.config.js
  # ─────────────────────────────────────────────────────────────────────────────
  tailwind-v4-directive-enforcement:
    name: Tailwind v4 Directive Enforcement
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Block legacy @tailwind directives in CSS files
        run: |
          VIOLATIONS=0
          while IFS= read -r -d '' file; do
            if grep -qE '@tailwind\s+(base|components|utilities)' "$file"; then
              echo "❌ LEGACY DIRECTIVE in: $file"
              grep -nE '@tailwind\s+(base|components|utilities)' "$file"
              VIOLATIONS=$((VIOLATIONS + 1))
            fi
          done < <(find . -name "*.css" -not -path "*/node_modules/*" -not -path "*/vendor/*" -print0)
          if [ "$VIOLATIONS" -gt 0 ]; then
            echo ""
            echo "❌ BUILD BLOCKED — Legacy @tailwind directives detected."
            echo "   Replace ALL with: @import \"tailwindcss\";"
            exit 1
          fi
          echo "✅ No legacy @tailwind directives — v4 clean"

      - name: Block tailwind.config.js (v3 format)
        run: |
          if find . -name "tailwind.config.js" -not -path "*/node_modules/*" -not -path "*/vendor/*" | grep -q .; then
            echo "❌ BUILD BLOCKED — tailwind.config.js found (v3 config format)"
            echo "   Migrate theme to @theme {} block in app.css"
            exit 1
          fi
          echo "✅ No tailwind.config.js — CSS-based v4 config confirmed"

      - name: Verify @import tailwindcss entrypoint
        run: |
          if [ ! -f "resources/css/app.css" ]; then
            echo "❌ resources/css/app.css not found"
            exit 1
          fi
          if ! grep -qE "@import ['\"]tailwindcss['\"]" resources/css/app.css; then
            echo "❌ resources/css/app.css is missing @import \"tailwindcss\""
            echo "   Remove: @tailwind base; @tailwind components; @tailwind utilities;"
            echo "   Add:    @import \"tailwindcss\";"
            exit 1
          fi
          echo "✅ @import \"tailwindcss\" confirmed in app.css"

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 7 — Phase 10.2.8: Frontend Engine Parity Check
  # Verifies both projects share identical Tailwind v4 config structure
  # ─────────────────────────────────────────────────────────────────────────────
  frontend-engine-parity:
    name: Frontend Engine Parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check @tailwindcss/vite in package.json
        run: |
          if ! grep -q '"@tailwindcss/vite"' package.json; then
            echo "❌ @tailwindcss/vite missing from package.json devDependencies"
            exit 1
          fi
          TW_VER=$(node -e "const p=JSON.parse(require('fs').readFileSync('package.json')); console.log(p.devDependencies?.tailwindcss || 'missing')")
          MAJOR=$(echo "$TW_VER" | grep -oP '[\d]+' | head -1)
          echo "Declared tailwindcss: $TW_VER (major: $MAJOR)"
          if [ "$MAJOR" -lt 4 ] 2>/dev/null; then
            echo "❌ package.json declares tailwindcss $TW_VER — must be ^4.x"
            exit 1
          fi
          echo "✅ package.json correctly declares tailwindcss $TW_VER and @tailwindcss/vite"

      - name: Verify @source content scanning in app.css
        run: |
          SOURCE_COUNT=$(grep -c "@source" resources/css/app.css || true)
          if [ "$SOURCE_COUNT" -lt 1 ]; then
            echo "❌ No @source directives in app.css — content scanning will fail"
            exit 1
          fi
          echo "✅ Found $SOURCE_COUNT @source directive(s) in app.css"

      - name: Verify @theme block in app.css
        run: |
          if ! grep -q "@theme" resources/css/app.css; then
            echo "❌ @theme block missing from app.css — font/color tokens will not generate"
            exit 1
          fi
          echo "✅ @theme block present in app.css"

      - name: Verify design-tokens.css is the single source of truth
        run: |
          TOKEN="packages/saas-platform/core-utils/resources/css/design-tokens.css"
          if [ ! -f "$TOKEN" ]; then
            echo "❌ Canonical design-tokens.css not found at $TOKEN"
            exit 1
          fi
          if ! grep -q "design-tokens.css" resources/css/app.css; then
            echo "❌ design-tokens.css not imported in saas-platform app.css"
            exit 1
          fi
          echo "✅ Canonical design-tokens.css exists and is imported"
