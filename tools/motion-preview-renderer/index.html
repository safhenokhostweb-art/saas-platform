<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Motion Preview Renderer</title><link rel="stylesheet" href="./renderer/styles.css"></head><body><header><div><small>Motion Preview & Rendering Engine</small><h1>پیش‌نمایش حرفه‌ای موشن وب</h1></div><div class="modes"><button data-mode="designer" class="active">طراح</button><button data-mode="customer">مشتری</button><button data-mode="mobile">موبایل</button></div></header><main><aside class="inspector"><label>نمونه<select id="example"></select></label><label>سرعت<select id="rate"><option>.5</option><option selected>1</option><option>1.5</option><option>2</option></select></label><h3>تم زنده</h3><div id="theme"></div><h3>Preset</h3><select id="preset"></select><section><strong>Quality</strong><output id="quality">—</output><div id="warnings"></div></section><section><strong>Performance</strong><pre id="performance"></pre></section></aside><section class="studio"><div class="viewport-shell"><div id="viewport" class="viewport" aria-live="polite"></div></div><div class="controls"><button id="play">▶</button><button id="pause">Ⅱ</button><input id="scrubber" type="range" min="0" step=".01" value="0"><output id="clock">0.00s</output></div><div class="designer-only"><h2>Timeline</h2><div id="timeline" class="timeline"></div><h2>Layers</h2><div id="layers" class="layers"></div></div></section></main><script type="module" src="./engine/app.js"></script></body></html>
