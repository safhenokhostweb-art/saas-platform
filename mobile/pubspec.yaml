name: saas_platform_client
description: Unified Support Client — Android, iOS, Windows, Linux, macOS
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^14.2.0

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # HTTP client
  dio: ^5.4.3
  retrofit: ^4.1.0

  # WebSocket (Reverb / Pusher protocol)
  pusher_channels_flutter: ^2.0.3

  # Secure storage
  flutter_secure_storage: ^9.2.2

  # Local notifications (desktop + mobile)
  flutter_local_notifications: ^17.2.2

  # Offline DB
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0

  # System tray (desktop)
  system_tray: ^2.0.3

  # Desktop window management
  window_manager: ^0.3.9

  # Launch at startup (desktop)
  launch_at_startup: ^0.3.0

  # Image / file handling
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  cached_network_image: ^3.3.1

  # Crypto / encoding
  crypto: ^3.0.3
  convert: ^3.1.1
  jose: ^0.3.4

  # Package info (version checking for OTA)
  package_info_plus: ^8.0.2

  # Connectivity
  connectivity_plus: ^6.0.3

  # App lifecycle
  app_lifecycle: ^0.0.5

  # Shared preferences (non-sensitive)
  shared_preferences: ^2.3.2

  # URL launcher
  url_launcher: ^6.3.0

  # Intl / RTL (Persian support)
  intl: ^0.19.0
  flutter_localizations:
    sdk: flutter

  # Icons
  flutter_svg: ^2.0.10+1

  # Badges
  badges: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.3
  retrofit_generator: ^8.1.0
  drift_dev: ^2.18.0
  json_serializable: ^6.8.0
  json_annotation: ^4.9.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/icons/
    - assets/images/
    - assets/fonts/

  fonts:
    - family: Vazir
      fonts:
        - asset: assets/fonts/Vazir.ttf
        - asset: assets/fonts/Vazir-Bold.ttf
          weight: 700
        - asset: assets/fonts/Vazir-Light.ttf
          weight: 300
