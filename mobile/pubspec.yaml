name: saas_platform_client
description: Unified Support Client — Android, iOS, Windows, Linux, macOS
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^14.2.0

  # State management
  flutter_riverpod: ^2.5.1

  # HTTP client
  dio: ^5.4.3

  # WebSocket (Reverb / Pusher protocol)
  pusher_channels_flutter: ^2.0.3

  # Secure storage
  flutter_secure_storage: ^9.2.2

  # Local notifications (desktop + mobile)
  flutter_local_notifications: ^17.2.2

  # Offline DB
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0

  # System tray (desktop)
  system_tray: ^2.0.3

  # Desktop window management
  window_manager: ^0.3.9

  # Launch at startup (desktop)
  launch_at_startup: ^0.3.0

  # File handling
  file_picker: ^8.1.2
  mime: ^1.0.4

  # Crypto / encoding
  crypto: ^3.0.3

  # Package info (version checking for OTA)
  package_info_plus: ^8.0.2

  # Connectivity
  connectivity_plus: ^6.0.3

  # Device info (for device ID generation)
  device_info_plus: ^10.1.0

  # Deep linking
  app_links: ^6.1.1

  # Shared preferences (non-sensitive)
  shared_preferences: ^2.3.2

  # URL launcher
  url_launcher: ^6.3.0

  # Audio for voice notifications
  audioplayers: ^6.1.0

  # OTA: Open files (APK install)
  open_file: ^3.3.2

  # Android permissions
  permission_handler: ^11.3.1

  # Intl / RTL (Persian support)
  intl: ^0.20.0
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

# Force compatible uuid version across system_tray and other deps
dependency_overrides:
  uuid: ^4.5.1

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
    - assets/fonts/

  fonts:
    - family: Vazir
      fonts:
        - asset: assets/fonts/Vazir.ttf
        - asset: assets/fonts/Vazir-Bold.ttf
          weight: 700
        - asset: assets/fonts/Vazir-Light.ttf
          weight: 300
